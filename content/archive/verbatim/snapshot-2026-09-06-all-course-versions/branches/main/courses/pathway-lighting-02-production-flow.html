          "name": "The Lighting Production Lifecycle",
          "objective": "Recognize the full path from creative intent to load-out.",
          "blocks": [
            {
              "type": "html",
              "html": "\u003cp>Lighting production flow is the organized process that turns a visual idea into a working, documented, safe, and repeatable system — creative intent, technical design, documentation, installation, testing, programming, live operation, and load-out. New crew are most useful once they understand where their task fits in that chain.\u003c/p>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>What You'll Learn\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>Recognize the full path from creative intent to load-out.\u003c/li>\n          \u003cli>Explain why the console is only one part of the lighting system.\u003c/li>\n          \u003cli>Identify the main phases of planning, installation, testing, operation, and removal.\u003c/li>\n          \u003cli>Understand why standardized process matters even when every venue is different.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>On a Real Call\u003c/h2>\n        \u003cp>The chain looks different in scale depending on the room, but not in shape.\u003c/p>\n        \u003cp>On a corporate ballroom load-in, the lighting crew may start with cases, truss, fixtures, cable, and a plot. By show time, that equipment has to become front light, scenic color, camera-friendly looks, cue lists, and a clean room for presenters. In an arena, the same concept scales into touring trusses, roof points, local labor, console files, and daily repeatability. On a festival, the workflow also has to support short artist changeovers and guest lighting packages.\u003c/p>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">The governing idea\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Large-scale lighting production is a chain of translations: creative intent becomes a technical design, the design becomes a documented system, and that system is installed, tested, programmed, operated, and safely removed. Standardize the process; adapt the implementation to the room.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cfigure class=\"cb-diagram\">\n        \u003cspan class=\"cb-diagram-label\">Diagram — The Production Lifecycle\u003c/span>\n        \u003csvg viewBox=\"0 0 680 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-labelledby=\"l2-1-title l2-1-desc\">\n          \u003ctitle id=\"l2-1-title\">The eight-stage lighting production lifecycle\u003c/title>\n          \u003cdesc id=\"l2-1-desc\">Creative Intent leads to Technical Design, then Documentation, Installation, Testing, Programming, Live Operation, and finally Load-Out.\u003c/desc>\n          \u003cg font-family=\"inherit\">\n            \u003crect x=\"20\" y=\"20\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"34\" cy=\"16\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"34\" y=\"19.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">1\u003c/text>\n            \u003ctext x=\"90\" y=\"50\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Creative Intent\u003c/text>\n            \u003cpath d=\"M160,45 L178,45\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M178,45 L170,40 L170,50 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"180\" y=\"20\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"194\" cy=\"16\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"194\" y=\"19.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">2\u003c/text>\n            \u003ctext x=\"250\" y=\"42\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Technical\u003c/text>\n            \u003ctext x=\"250\" y=\"58\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Design\u003c/text>\n            \u003cpath d=\"M320,45 L338,45\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M338,45 L330,40 L330,50 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"340\" y=\"20\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"354\" cy=\"16\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"354\" y=\"19.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">3\u003c/text>\n            \u003ctext x=\"410\" y=\"50\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Documentation\u003c/text>\n            \u003cpath d=\"M480,45 L498,45\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M498,45 L490,40 L490,50 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"500\" y=\"20\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"514\" cy=\"16\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"514\" y=\"19.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">4\u003c/text>\n            \u003ctext x=\"570\" y=\"50\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Installation\u003c/text>\n            \u003cpath d=\"M660,45 L660,120 L90,120 L90,168\" fill=\"none\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\n            \u003cpath d=\"M90,168 L85,158 L95,158 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"20\" y=\"170\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"34\" cy=\"166\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"34\" y=\"169.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">5\u003c/text>\n            \u003ctext x=\"90\" y=\"200\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Testing\u003c/text>\n            \u003cpath d=\"M160,195 L178,195\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M178,195 L170,190 L170,200 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"180\" y=\"170\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"194\" cy=\"166\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"194\" y=\"169.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">6\u003c/text>\n            \u003ctext x=\"250\" y=\"200\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Programming\u003c/text>\n            \u003cpath d=\"M320,195 L338,195\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M338,195 L330,190 L330,200 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"340\" y=\"170\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"354\" cy=\"166\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"354\" y=\"169.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">7\u003c/text>\n            \u003ctext x=\"410\" y=\"192\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Live\u003c/text>\n            \u003ctext x=\"410\" y=\"208\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Operation\u003c/text>\n            \u003cpath d=\"M480,195 L498,195\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M498,195 L490,190 L490,200 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"500\" y=\"170\" width=\"140\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"514\" cy=\"166\" r=\"9\" fill=\"var(--tc-gold)\"/>\u003ctext x=\"514\" y=\"169.5\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"900\" fill=\"var(--tc-bg-deep)\">8\u003c/text>\n            \u003ctext x=\"570\" y=\"200\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"var(--tc-text)\">Load-Out\u003c/text>\n          \u003c/g>\n        \u003c/svg>\n        \u003cfigcaption class=\"cb-diagram-caption\">Same eight stages on every scale of show — a ballroom and an arena both move through this chain, just with more people and more paperwork at the bigger end.\u003c/figcaption>\n      \u003c/figure>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Beginner Mistakes\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>\u003cstrong>Thinking the console is the whole system.\u003c/strong> The console depends on power, data, patching, addressing, networking, fixtures, paperwork, and crew execution.\u003c/li>\n          \u003cli>\u003cstrong>Ignoring the production critical path.\u003c/strong> Overhead work, power, stage release, and rehearsal access usually control the schedule.\u003c/li>\n          \u003cli>\u003cstrong>Treating paperwork as office work only.\u003c/strong> Documentation is how the crew knows what was intended, what changed, and what must be tested.\u003c/li>\n          \u003cli>\u003cstrong>Assuming every venue works like the last one.\u003c/strong> The process stays consistent, but roof points, access, power, labor, and rules change.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Professional Habit & Safety Notes\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Before starting a task, ask three questions\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">What phase are we in, who owns this decision, and what does this task affect next? Useful crew members protect the flow of work instead of only completing isolated tasks.\u003c/p>\n        \u003c/div>\n        \u003cp style=\"margin-top: 16px; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Safety notes:\u003c/strong> Do not perform work you have not been trained or authorized to do. Rigging, temporary power, lift operation, fall-protection work, and weather decisions must be performed or supervised by competent, appropriately qualified personnel. Production pressure never justifies bypassing inspection, exclusion zones, protective devices, engineered limits, or de-energization procedures.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Quick Knowledge Check\u003c/h2>\n        \u003cdiv class=\"cb-quiz-list\">\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">What is the best description of lighting production flow?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q1\">\n              \u003cbutton class=\"opt\" data-c=\"0\">Console programming — everything else is just prep.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">The full process from creative intent through load-out.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">Whatever sequence gets the rig hung fastest.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q1c\">\u003cstrong>Why:\u003c/strong> Production flow includes design, documentation, installation, testing, programming, operation, and load-out — not just what happens at the console.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">What does this awareness-level training not provide?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q2\">\n              \u003cbutton class=\"opt\" data-c=\"1\">Formal authorization to perform restricted work.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">Vocabulary for talking with the lighting crew.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">A general sense of how the workflow fits together.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q2c\">\u003cstrong>Why:\u003c/strong> This course builds vocabulary, workflow understanding, and safer decision-making habits — it does not certify or authorize rigging, electrical, lift, or fall-protection work.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Key Takeaway\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">The lighting rig is not built by the console; it is built by a coordinated workflow.\u003c/p>\n        \u003c/div>\n      \u003c/div>"
            }
          ]
        },
        {
          "name": "Advancing, Documentation, and Shop Preparation",
          "objective": "Recognize why pre-addressing, labeling, testing, and console preparation reduce jobsite risk.",
          "blocks": [
            {
              "type": "html",
              "html": "\u003cp>Advancing is the pre-production process of turning assumptions into confirmed information. Documentation turns the plan into instructions the crew can build, test, and revise. Shop preparation makes the load-in faster and safer by checking equipment before the venue clock starts.\u003c/p>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>What You'll Learn\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>Identify what gets confirmed during advance work.\u003c/li>\n          \u003cli>Recognize the core documents used by a lighting department.\u003c/li>\n          \u003cli>Explain why pre-addressing, labeling, testing, and console preparation reduce jobsite risk.\u003c/li>\n          \u003cli>Understand why one controlled record of changes matters.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>On a Real Call\u003c/h2>\n        \u003cp>Most of the risk in a fast load-in gets removed before anyone touches the truck.\u003c/p>\n        \u003cp>Before a stadium build, the team may confirm truck routes, dock access, floor loading, roof capacity, approved point loads, generator needs, FOH location, cable paths, lift access, fire lanes, curfews, and inspection requirements. In the shop, fixtures may be addressed, labeled, mode-checked, firmware-checked, tested, cased by zone, and matched to paperwork — all before the venue clock starts.\u003c/p>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">The patch list is the connective tissue\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">It maps console identities, fixture addresses, universes, and outputs together. When it's out of date, everything downstream — troubleshooting, checkout, even the show itself — gets harder.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Beginner Mistakes\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>\u003cstrong>Waiting until site to discover missing information.\u003c/strong> Unconfirmed roof, power, door size, or cable route details can stop the build.\u003c/li>\n          \u003cli>\u003cstrong>Using old paperwork after field changes.\u003c/strong> A stale patch sheet can waste hours during troubleshooting.\u003c/li>\n          \u003cli>\u003cstrong>Labeling only one end of a cable.\u003c/strong> Both ends need to be traceable when the rig is built, flown, or packed.\u003c/li>\n          \u003cli>\u003cstrong>Assuming RDM or network discovery replaces physical labels and inspection.\u003c/strong> Digital tools help, but they do not replace controlled paperwork.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Professional Habit & Safety Notes\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Update paperwork during the build, not after memory fades\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">When a fixture, address, universe, cable route, or substitution changes, make sure the department lead knows and the controlled record is updated — while it's fresh, not at strike.\u003c/p>\n        \u003c/div>\n        \u003cp style=\"margin-top: 16px; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Safety notes:\u003c/strong> Documentation must not be treated as proof that a system is safe by itself. Rigging plans, power schedules, and point plans may require engineering, qualified inspection, venue approval, licensed personnel, or local authority review. Follow the site process before acting on technical documents.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Quick Knowledge Check\u003c/h2>\n        \u003cdiv class=\"cb-quiz-list\">\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">Why should both ends of important cables be labeled?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q3\">\n              \u003cbutton class=\"opt\" data-c=\"0\">It replaces the need for a patch sheet.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">It helps tracing, troubleshooting, flying, striking, and packing.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">It's only useful for cables leaving the venue.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q3c\">\u003cstrong>Why:\u003c/strong> Two-end labeling improves traceability at every stage of the build and strike — but it doesn't replace the patch sheet.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">Which document maps console identities, fixture addresses, universes, and outputs together?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q4\">\n              \u003cbutton class=\"opt\" data-c=\"0\">The rigging plot.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">The power schedule.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">The patch list.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q4c\">\u003cstrong>Why:\u003c/strong> The patch list connects console and physical/network control information — it's the map between what the operator sees and what's actually hung and addressed.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">A client requests a lighting change after the rig is already built. What should happen?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q5\">\n              \u003cbutton class=\"opt\" data-c=\"0\">Make the change quietly — it's faster than raising it.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">Tell the client it's too late for any changes.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">Escalate through the lead and update the records.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q5c\">\u003cstrong>Why:\u003c/strong> Late revisions affect labor, equipment, programming, and safety — not just the look. Escalate through the lead and assess the impact before anything changes.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Key Takeaway\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Good paperwork is a safety tool, a troubleshooting tool, and a speed tool.\u003c/p>\n        \u003c/div>\n      \u003c/div>"
            }
          ]
        },
        {
          "name": "Load-In, Rig Assembly, and Department Coordination",
          "objective": "Describe the early sequence of a lighting load-in and how lighting interfaces with other departments.",
          "blocks": [
            {
              "type": "html",
              "html": "\u003cp>Load-in establishes the jobsite, sorts equipment, builds the lighting system, and protects the production critical path. Lighting crew don't work in isolation — the department has to coordinate with rigging, scenic, audio, video, automation, venue staff, and production management.\u003c/p>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>What You'll Learn\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>Describe the early sequence of a lighting load-in.\u003c/li>\n          \u003cli>Identify how lighting work interfaces with rigging, audio, video, scenic, automation, and venue operations.\u003c/li>\n          \u003cli>Recognize why overhead work and exclusion zones matter.\u003c/li>\n          \u003cli>Understand the load path concept at an awareness level.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>On a Real Call\u003c/h2>\n        \u003cp>Once the rig is overhead, access gets much harder — so most of the important work happens before it flies.\u003c/p>\n        \u003cp>On an arena call, local hands may unload trucks, sort cases by truss or zone, help assemble truss, hang fixtures under direction, install looms, and prepare systems for inspection before the truss flies. Once the rig is overhead, orientation, clamps, secondary retention, cabling, and inspection all need to be handled before lift or show trim — not after.\u003c/p>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">The load path, at an awareness level\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Fixture → clamp → truss → suspension hardware → hoist → rigging point → building or temporary structure. Understand the concept — do not make rigging judgments unless you're trained and authorized.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cfigure class=\"cb-diagram\">\n        \u003cspan class=\"cb-diagram-label\">Diagram — The Load Path\u003c/span>\n        \u003csvg viewBox=\"0 0 380 528\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-labelledby=\"l2-3-title l2-3-desc\">\n          \u003ctitle id=\"l2-3-title\">The lighting load path from fixture to structure\u003c/title>\n          \u003cdesc id=\"l2-3-desc\">Weight travels from the fixture through the clamp, truss, suspension hardware, hoist, and rigging point, into the building or temporary structure.\u003c/desc>\n          \u003cg>\n            \u003crect x=\"40\" y=\"20\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"190\" y=\"47\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Fixture\u003c/text>\n            \u003cpath d=\"M190,64 L190,88\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M190,94 L184,84 L196,84 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"40\" y=\"94\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"190\" y=\"121\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Clamp\u003c/text>\n            \u003cpath d=\"M190,138 L190,162\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M190,168 L184,158 L196,158 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"40\" y=\"168\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"190\" y=\"195\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Truss\u003c/text>\n            \u003cpath d=\"M190,212 L190,236\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M190,242 L184,232 L196,232 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"40\" y=\"242\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"190\" y=\"269\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Suspension Hardware\u003c/text>\n            \u003cpath d=\"M190,286 L190,310\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M190,316 L184,306 L196,306 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"40\" y=\"316\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"190\" y=\"343\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Hoist\u003c/text>\n            \u003cpath d=\"M190,360 L190,384\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M190,390 L184,380 L196,380 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"40\" y=\"390\" width=\"300\" height=\"44\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"190\" y=\"417\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Rigging Point\u003c/text>\n            \u003cpath d=\"M190,434 L190,458\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M190,464 L184,454 L196,454 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"40\" y=\"464\" width=\"300\" height=\"52\" rx=\"8\" fill=\"var(--tc-panel)\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\n            \u003ctext x=\"190\" y=\"486\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"var(--tc-gold-strong)\">Building / Temporary\u003c/text>\n            \u003ctext x=\"190\" y=\"502\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"var(--tc-gold-strong)\">Structure\u003c/text>\n          \u003c/g>\n        \u003c/svg>\n        \u003cfigcaption class=\"cb-diagram-caption\">Every point in this chain is carrying the load of everything below the rigging point — it's an awareness concept, not a rigging judgment you're authorized to make on your own.\u003c/figcaption>\n      \u003c/figure>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Beginner Mistakes\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>\u003cstrong>Standing under moving or suspended loads.\u003c/strong> Overhead work requires controlled zones and direction from qualified leads.\u003c/li>\n          \u003cli>\u003cstrong>Moving gear into another department's path.\u003c/strong> Audio, video, scenic, rigging, and lighting often compete for space, lifts, and timing.\u003c/li>\n          \u003cli>\u003cstrong>Hanging fixtures without verifying orientation or plot position.\u003c/strong> A fixture in the wrong place may require unsafe or time-consuming correction later.\u003c/li>\n          \u003cli>\u003cstrong>Dressing cable where it can pinch, snag, touch moving parts, block exits, or create trip hazards.\u003c/strong> Cable routing affects both function and safety.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Professional Habit & Safety Notes\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Stay aware of zones and sequencing\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Ask before moving equipment that may be staged for another zone, department, or truck-pack order — and stay aware of overhead activity and the lead's sequencing at all times.\u003c/p>\n        \u003c/div>\n        \u003cp style=\"margin-top: 16px; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Safety notes:\u003c/strong> New stagehands should understand the load-path concept but must not make rigging judgments unless trained and authorized. Do not climb, alter rigging hardware, remove retention, or enter exclusion zones without approval.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Quick Knowledge Check\u003c/h2>\n        \u003cdiv class=\"cb-quiz-list\">\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">What is the safest response if you notice missing secondary retention on an overhead fixture?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q6\">\n              \u003cbutton class=\"opt\" data-c=\"0\">Add a safety cable yourself if one is nearby.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">Leave it — it's probably intentional for this rig.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">Notify the department lead and follow site direction.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q6c\">\u003cstrong>Why:\u003c/strong> Overhead safety issues must be escalated through qualified supervision, not fixed or ignored on your own.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Scenario: Overhead Retention Concern\u003c/h2>\n        \u003cp>During truss prep, you notice a fixture that appears to be missing secondary retention. What do you do before the truss moves?\u003c/p>\n        \u003cdiv class=\"cb-panel\">\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Do not ignore it, and do not try to fix it outside your authorization. Notify the department lead immediately and keep people clear as directed. Overhead concerns require qualified direction before lifting or flying — every time.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Key Takeaway\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">A fast load-in depends on sequencing, communication, zones, labels, and respect for overhead risk.\u003c/p>\n        \u003c/div>\n      \u003c/div>"
            }
          ]
        },
        {
          "name": "Power, Control Data, Networks, and Layered Troubleshooting",
          "objective": "Separate power problems from data, patch, configuration, and mechanical problems.",
          "blocks": [
            {
              "type": "html",
              "html": "\u003cp>A fixture needs suitable power and correct control data. Similar symptoms can come from different layers — source power, distro, circuit, cable, address, mode, patch, node output, universe, IP configuration, fixture mechanics, or console programming. Good troubleshooting isolates one layer at a time.\u003c/p>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>What You'll Learn\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>Separate power problems from data, patch, configuration, and mechanical problems.\u003c/li>\n          \u003cli>Recognize the basic path from console to fixtures.\u003c/li>\n          \u003cli>Understand DMX, RDM, sACN, Art-Net, universes, nodes, and switches at an introductory level.\u003c/li>\n          \u003cli>Explain why temporary power work is restricted to qualified personnel.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>On a Real Call\u003c/h2>\n        \u003cp>A common control path is LD/operator to console, console to Ethernet switch or fiber, switch to gateway or DMX node, node to DMX line, then fixture.\u003c/p>\n        \u003cp>On a festival, the house backbone may support visiting consoles and guest universes. On a corporate show, the network may also interface with show control or video systems. In every case, a fixture that isn't responding could be a power problem, a data problem, a patch problem, or a mechanical problem — and they look similar from the floor.\u003c/p>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">A lit fixture isn't a fully-checked fixture\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Pan, tilt, zoom, shutters, color, fans, encoders, and network settings still need checkout even after a fixture makes light.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cfigure class=\"cb-diagram\">\n        \u003cspan class=\"cb-diagram-label\">Diagram — Lighting Control Signal Flow\u003c/span>\n        \u003csvg viewBox=\"0 0 680 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-labelledby=\"l2-4-title l2-4-desc\">\n          \u003ctitle id=\"l2-4-title\">Lighting control signal flow from operator to fixture\u003c/title>\n          \u003cdesc id=\"l2-4-desc\">The LD or operator sends commands through the console, an Ethernet switch or fiber run, a gateway or DMX node, and a DMX line, to reach fixtures, dimmers, and relays.\u003c/desc>\n          \u003cg>\n            \u003crect x=\"20\" y=\"20\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"120\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">LD / Operator\u003c/text>\n            \u003cpath d=\"M220,45 L238,45\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M238,45 L230,40 L230,50 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"240\" y=\"20\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"340\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Lighting Console\u003c/text>\n            \u003cpath d=\"M440,45 L458,45\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M458,45 L450,40 L450,50 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"460\" y=\"20\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"560\" y=\"42\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Ethernet Switch\u003c/text>\n            \u003ctext x=\"560\" y=\"58\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">or Fiber\u003c/text>\n            \u003cpath d=\"M660,45 L660,120 L120,120 L120,168\" fill=\"none\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\n            \u003cpath d=\"M120,168 L115,158 L125,158 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"20\" y=\"170\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"120\" y=\"192\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">Gateway /\u003c/text>\n            \u003ctext x=\"120\" y=\"208\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">DMX Node\u003c/text>\n            \u003cpath d=\"M220,195 L238,195\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M238,195 L230,190 L230,200 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"240\" y=\"170\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--tc-card)\" stroke=\"var(--tc-border-strong)\" stroke-width=\"1.5\"/>\n            \u003ctext x=\"340\" y=\"200\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--tc-text)\">DMX Line\u003c/text>\n            \u003cpath d=\"M440,195 L458,195\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\u003cpath d=\"M458,195 L450,190 L450,200 Z\" fill=\"var(--tc-gold-border)\"/>\n            \u003crect x=\"460\" y=\"170\" width=\"200\" height=\"50\" rx=\"8\" fill=\"var(--tc-panel)\" stroke=\"var(--tc-gold-border)\" stroke-width=\"2\"/>\n            \u003ctext x=\"560\" y=\"192\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"var(--tc-gold-strong)\">Fixtures, Dimmers,\u003c/text>\n            \u003ctext x=\"560\" y=\"208\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"var(--tc-gold-strong)\">Relays\u003c/text>\n          \u003c/g>\n        \u003c/svg>\n        \u003cfigcaption class=\"cb-diagram-caption\">A fixture not responding could be a break anywhere in this chain — power, data, patching, or the fixture itself — not necessarily the last link.\u003c/figcaption>\n      \u003c/figure>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Beginner Mistakes\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>\u003cstrong>Changing several variables at once.\u003c/strong> This can hide the actual fault and create new problems.\u003c/li>\n          \u003cli>\u003cstrong>Assuming a lit fixture is fully functional.\u003c/strong> Pan, tilt, zoom, shutters, color, fans, encoders, and network settings still need checkout.\u003c/li>\n          \u003cli>\u003cstrong>Confusing DMX slots with fixture count.\u003c/strong> One fixture may use many slots.\u003c/li>\n          \u003cli>\u003cstrong>Assuming Ethernet automatically means the network is correct.\u003c/strong> IP addressing, universe routing, multicast/unicast behavior, priority, merging, VLANs, and switch configuration all matter.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Professional Habit & Safety Notes\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Troubleshoot in layers\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Confirm what changed, identify the symptom, isolate the simplest layer first, communicate before changing shared settings, and record the fix if it changes the build.\u003c/p>\n        \u003c/div>\n        \u003cp style=\"margin-top: 16px; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Safety notes:\u003c/strong> Temporary entertainment power must be designed, connected, and inspected by properly qualified personnel under applicable codes, venue rules, employer procedures, and authority requirements. Single-pole feeder connectors, grounding, bonding, protective devices, lockout/tagout, and verified de-energization are not beginner tasks. Treat grounding and bonding as life-safety systems.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Quick Knowledge Check\u003c/h2>\n        \u003cdiv class=\"cb-quiz-list\">\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">A fixture turns on but does not pan or tilt. What should a beginner assume?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q7\">\n              \u003cbutton class=\"opt\" data-c=\"0\">It's fully working since it powers on.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">It may still have a control, patch, mode, mechanical, or parameter issue.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">It just needs to be power-cycled once more.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q7c\">\u003cstrong>Why:\u003c/strong> Light output alone doesn't prove full function. Movement, color, and other parameters depend on separate systems working correctly together.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">Who should perform or supervise temporary entertainment power connection and inspection?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q8\">\n              \u003cbutton class=\"opt\" data-c=\"0\">Any crew member who's watched it done before.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">Properly qualified personnel under site rules.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">Whoever's fastest to get the rig powered up.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q8c\">\u003cstrong>Why:\u003c/strong> This is restricted, safety-sensitive work, not a beginner task. It stays with properly qualified personnel under site rules.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">The console patch says a fixture is in one mode, but the fixture is set to another mode. What's the likely result?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q9\">\n              \u003cbutton class=\"opt\" data-c=\"0\">No difference — modes are cosmetic labels.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">The fixture will automatically match the console.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">Parameters may respond incorrectly or not at all.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q9c\">\u003cstrong>Why:\u003c/strong> Console personality and fixture mode have to match. A mismatch is a common, confusing source of \"broken\" fixtures that aren't actually broken.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">What is a DMX universe?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q10\">\n              \u003cbutton class=\"opt\" data-c=\"0\">The total number of fixtures on a rig.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">A set of up to 512 DMX data slots.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">A single data cable run from console to fixture.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q10c\">\u003cstrong>Why:\u003c/strong> It's a control-data grouping, not a fixture count. One universe can address multiple fixtures depending on how many channels each one uses.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">What's the professional habit during troubleshooting?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q11\">\n              \u003cbutton class=\"opt\" data-c=\"0\">Change several settings at once to find the fix faster.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">Isolate layers and communicate before changing shared settings.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">Reset the whole console and start the patch over.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q11c\">\u003cstrong>Why:\u003c/strong> Layered troubleshooting reduces new errors. Changing shared settings without communicating can create a second problem on top of the first.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Scenario Practice\u003c/h2>\n        \u003cp>Two real situations. Think through your response before reading the expected one.\u003c/p>\n        \u003cdiv class=\"cb-drill-grid\">\n          \u003cdiv class=\"cb-panel\" style=\"padding: 20px 22px;\">\n            \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Patch Mismatch at Checkout\u003c/strong>\n            \u003cp style=\"margin: 0 0 10px; color: var(--tc-muted); font-size: 14px;\">A moving light responds to intensity, but the color and zoom controls are wrong. The paperwork shows one personality, but the fixture menu appears to show a different mode.\u003c/p>\n            \u003cp style=\"margin: 0; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Expected response:\u003c/strong> Stop guessing. Tell the lead or programmer what you observed. Compare fixture mode, address, universe, console personality, and paperwork before changing anything.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"cb-panel\" style=\"padding: 20px 22px;\">\n            \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Festival Guest Console\u003c/strong>\n            \u003cp style=\"margin: 0 0 10px; color: var(--tc-muted); font-size: 14px;\">A visiting LD asks to plug a console into the house lighting network during a fast changeover.\u003c/p>\n            \u003cp style=\"margin: 0; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Expected response:\u003c/strong> Direct the request to the house lighting lead or network lead. Do not patch unknown network gear or change switch/node settings without authorization.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Key Takeaway\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Do not guess across the whole system; isolate the layer and escalate restricted work.\u003c/p>\n        \u003c/div>\n      \u003c/div>"
            }
          ]
        },
        {
          "name": "Focus, Programming, Show Operation, and Load-Out",
          "objective": "Explain the difference between function check, focus, programming, and operation.",

              "type": "html",
              "html": "\u003cp>After installation, the lighting system must be checked, focused, programmed, rehearsed, operated, and removed. A fixture making light isn't enough — the crew has to verify full response, aim and calibrate fixtures, build repeatable console logic, operate safely during the show, and load out without losing information or damaging equipment.\u003c/p>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>What You'll Learn\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>Explain the difference between function check, focus, programming, and operation.\u003c/li>\n          \u003cli>Recognize how scripted shows and busked shows differ.\u003c/li>\n          \u003cli>Understand why some faults are not repaired during a live performance.\u003c/li>\n          \u003cli>Identify load-out risks and documentation needs.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>On a Real Call\u003c/h2>\n        \u003cp>How a show gets run depends on the format — but the discipline underneath stays the same.\u003c/p>\n        \u003cp>In a theater or corporate cue-to-cue, the programmer may build precise cue stacks timed to a script. In concerts and festivals, the operator may combine stored cues, palettes, effects, and live busking. During show operation, the lighting team monitors power, data, fixtures, weather, backups, cueing, visibility, and communication with the show caller or stage management.\u003c/p>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Focus is more than pointing a light\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Focus includes purpose, position, shuttering, color quality, camera needs, scenic interaction, and documentation — not just aiming a fixture in a general direction.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Beginner Mistakes\u003c/h2>\n        \u003cul class=\"cb-list\">\n          \u003cli>\u003cstrong>Treating focus as just pointing lights generally.\u003c/strong> Focus includes purpose, position, shuttering, color quality, camera needs, scenic interaction, and documentation.\u003c/li>\n          \u003cli>\u003cstrong>Ignoring backup files.\u003c/strong> Console files and show data should be saved and backed up throughout programming and before load-out.\u003c/li>\n          \u003cli>\u003cstrong>Trying to repair every show fault immediately.\u003c/strong> Access risk and the possibility of causing a bigger failure matter more than fixing it fast.\u003c/li>\n          \u003cli>\u003cstrong>Rushing load-out because the show is over.\u003c/strong> Fatigue, darkness, simultaneous departments, and schedule pressure make load-out high-risk, not low-risk.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Professional Habit & Safety Notes\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Stay disciplined through show and load-out\u003c/strong>\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">Listen to the chain of command, confirm releases before moving or de-energizing systems, protect cable paths, document damage, and pack by the planned truck order.\u003c/p>\n        \u003c/div>\n        \u003cp style=\"margin-top: 16px; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Safety notes:\u003c/strong> Do not access overhead equipment, energized equipment, lifts, roofs, or restricted work areas during a show or load-out unless directed by authorized leads and trained for the task. Public clearance, department release, de-energization procedures, and controlled lowering of flown systems must be respected.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Quick Knowledge Check\u003c/h2>\n        \u003cdiv class=\"cb-quiz-list\">\n          \u003cdiv class=\"cb-quiz-item\">\n            \u003cp class=\"quiz-q\">Why is load-out considered high risk?\u003c/p>\n            \u003cdiv class=\"options\" data-q=\"l2q12\">\n              \u003cbutton class=\"opt\" data-c=\"0\">It isn't — the show is over, so the pressure is off.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"1\">Fatigue, darkness, schedule pressure, and many departments moving at once all increase hazard.\u003c/button>\n              \u003cbutton class=\"opt\" data-c=\"0\">Only the rigging crew faces real risk during load-out.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"coach\" id=\"l2q12c\">\u003cstrong>Why:\u003c/strong> The work isn't over just because the show is. Load-out combines fatigue, reduced visibility, time pressure, and multiple departments moving gear simultaneously.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Scenario Practice\u003c/h2>\n        \u003cp>Two real situations. Think through your response before reading the expected one.\u003c/p>\n        \u003cdiv class=\"cb-drill-grid\">\n          \u003cdiv class=\"cb-panel\" style=\"padding: 20px 22px;\">\n            \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Corporate Room Access Conflict\u003c/strong>\n            \u003cp style=\"margin: 0 0 10px; color: var(--tc-muted); font-size: 14px;\">Lighting needs a lift to focus front light, but catering is setting tables and scenic is still working downstage.\u003c/p>\n            \u003cp style=\"margin: 0; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Expected response:\u003c/strong> Don't drive or move equipment through another department without direction. Ask the lighting lead where to stage and wait for coordinated access.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"cb-panel\" style=\"padding: 20px 22px;\">\n            \u003cstrong style=\"color: var(--tc-gold-strong); display: block; margin-bottom: 8px;\">Load-Out Fatigue\u003c/strong>\n            \u003cp style=\"margin: 0 0 10px; color: var(--tc-muted); font-size: 14px;\">After a long show day, multiple departments are striking at once and a cable path crosses an exit route.\u003c/p>\n            \u003cp style=\"margin: 0; color: var(--tc-muted); font-size: 14px;\">\u003cstrong style=\"color: var(--tc-text);\">Expected response:\u003c/strong> Report the blocked or unsafe path to the lead and help reroute/protect cable only as directed. Maintain awareness of public clearance and department release.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Key Takeaway\u003c/h2>\n        \u003cdiv class=\"cb-panel\">\n          \u003cp style=\"margin: 0; color: var(--tc-muted);\">The show is not finished until the system is safely removed, documented, packed, and accounted for.\u003c/p>\n        \u003c/div>\n      \u003c/div>"
            }
          ]
        },

            {
              "type": "html",
              "html": "\u003cp>Terms and citations used throughout this course. Come back to this lesson any time you need to look something up.\u003c/p>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Glossary\u003c/h2>\n        \u003cdiv class=\"cb-glossary-list\">\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Address\u003c/strong>\u003cspan>The starting control slot assigned to a fixture, used to match it to the console patch.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Art-Net\u003c/strong>\u003cspan>An IP-based entertainment-control protocol that can carry many universes across Ethernet networks.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Busking\u003c/strong>\u003cspan>Live improvised operation using prepared groups, palettes, effects, and playbacks &mdash; common in concerts and festivals.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Circuit\u003c/strong>\u003cspan>An electrical path supplying loads through appropriate protection.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Cue\u003c/strong>\u003cspan>A recorded lighting state or action, executed by an operator or triggered by show control/timecode.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>DMX Universe\u003c/strong>\u003cspan>A set of up to 512 DMX data slots &mdash; a control-data grouping, not a fixture count.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Distro\u003c/strong>\u003cspan>Temporary electrical distribution equipment &mdash; restricted power equipment handled by qualified personnel.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>FOH\u003c/strong>\u003cspan>Front of house &mdash; usually an audience-area operating or lighting position.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Loom\u003c/strong>\u003cspan>A grouped bundle of cables, often preassembled, that speeds repeated truss or floor-package installation.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Node\u003c/strong>\u003cspan>A device that converts or routes network control data to outputs such as DMX.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Patch\u003c/strong>\u003cspan>The mapping between console identities and physical or network outputs &mdash; must match addresses, modes, universes, and outputs.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Point\u003c/strong>\u003cspan>An approved suspension location for rigging &mdash; requires qualified approval, never assumed safe by beginners.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>RDM\u003c/strong>\u003cspan>Bidirectional management over compatible DMX infrastructure &mdash; helps identify or monitor fixtures, but doesn't replace paperwork.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>sACN\u003c/strong>\u003cspan>A standardized IP-based transport for entertainment-control levels, requiring correct addressing and routing.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Secondary retention\u003c/strong>\u003cspan>A secondary means intended to retain equipment if the primary attachment fails &mdash; part of overhead fixture safety.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Trim\u003c/strong>\u003cspan>The final operating height of flown equipment &mdash; access gets harder once trusses reach show trim.\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>VLAN\u003c/strong>\u003cspan>Logical network separation through managed switching, used to separate show-control or lighting traffic when designed and tested.\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cb-section\">\n        \u003ch2>Sources &amp; Standards\u003c/h2>\n        \u003cp>This course was built from a structured research packet that names the professional literature, standards bodies, and organizations its content draws on. Standards, codes, and editions change &mdash; verify current applicability before relying on any of these for an actual job. None of this replaces engineered plans, manufacturer instructions, or direction from qualified, authorized personnel.\u003c/p>\n        \u003cdiv class=\"cb-glossary-list\">\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Huntington, J. (2007)\u003c/strong>\u003cspan>Control Systems for Live Entertainment. Focal Press/Routledge. \u003ca href=\"https://www.taylorfrancis.com/books/mono/10.4324/9780080557533/control-systems-live-entertainment-john-huntington\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">taylorfrancis.com\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Huntington, J. (2012)\u003c/strong>\u003cspan>Show Networks and Control Systems. Zircon Designs Press. \u003ca href=\"https://books.google.com/books?id=zLXLNT9oK5UC\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">Google Books\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Cadena, R. (2021)\u003c/strong>\u003cspan>Electricity for the Entertainment Electrician &amp; Technician. Routledge. \u003ca href=\"https://doi.org/10.4324/9780429285370\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">doi.org\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Moody, J. &amp; Dexter, P. (2016)\u003c/strong>\u003cspan>Concert Lighting: The Art and Business of Entertainment Lighting. Routledge. \u003ca href=\"https://books.google.com/books?id=wi0lDwAAQBAJ\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">Google Books\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Shelley, S. L. (2013)\u003c/strong>\u003cspan>A Practical Guide to Stage Lighting. Routledge. \u003ca href=\"https://doi.org/10.4324/9780203553275\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">doi.org\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>Cadena, R. (2017)\u003c/strong>\u003cspan>Automated Lighting: The Art and Science of Moving and Color-Changing Lights. Routledge. \u003ca href=\"https://doi.org/10.4324/9781315724492\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">doi.org\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>ETCP\u003c/strong>\u003cspan>Entertainment Technician Certification Program &mdash; recognized certifications for entertainment electricians and riggers. \u003ca href=\"https://etcp.esta.org/certify/educational_electrical.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">etcp.esta.org\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>ESTA\u003c/strong>\u003cspan>Entertainment Services and Technology Association &mdash; Technical Standards Program (DMX512-A, RDM, sACN, rigging, control systems). \u003ca href=\"https://tsp.esta.org/tsp/documents/published_docs.php\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">tsp.esta.org\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>USITT\u003c/strong>\u003cspan>United States Institute for Theatre Technology. \u003ca href=\"https://www.usitt.org/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">usitt.org\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>OSHA\u003c/strong>\u003cspan>Occupational Safety and Health Administration. \u003ca href=\"https://www.osha.gov/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">osha.gov\u003c/a>\u003c/span>\u003c/div>\n          \u003cdiv class=\"cb-glossary-item\">\u003cstrong>NFPA\u003c/strong>\u003cspan>National Fire Protection Association &mdash; publishes NFPA 70, the National Electrical Code. \u003ca href=\"https://www.nfpa.org/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color: var(--tc-gold-strong);\">nfpa.org\u003c/a>\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cp style=\"margin-top: 16px; color: var(--tc-muted); font-size: 14px;\">This course does not cite specific standard clauses inline &mdash; it teaches the underlying concepts (production lifecycle, documentation discipline, layered troubleshooting, power/data planning) at an awareness level, and points here to where the enforceable and technical detail actually lives.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n  \u003c/div>\n\u003c/div>\n\n\u003cfooter>\n  \u003cp>&copy; 2026 The Crew Blueprint, a brand of Deadhang Labor LLC. All rights reserved.\u003c/p>\n\u003c/footer>"
