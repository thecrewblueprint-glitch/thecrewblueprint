        content: `
          <h2>From Source to Listener</h2>
          <div class="explainer">
            <p>Every live sound system moves a signal along the same basic chain: <strong>source → transducer/input → preamp/gain → processing → routing/buses → output processing → amplification → loudspeaker → listener</strong>. A stage box, a digital network, DSP, or a wireless link might sit inside that chain, but they're extensions of it, not separate systems you learn one at a time. Before you learn what a control does, know where the signal is right now, what's happening to it, where it's going next, and how you'd confirm it got there.</p>
          </div>
          <p>A microphone or a DI box turns physical sound or an instrument's signal into an electrical signal at the very start of that chain. Different sources produce different signal levels — <strong>microphone level</strong>, <strong>instrument level</strong>, and <strong>line level</strong> aren't interchangeable, and an input built for one doesn't automatically handle another cleanly. That's why matching source to input matters more than memorizing one voltage number.</p>
          <p>You'll see XLR, TS, and TRS connectors constantly, but the connector shape doesn't tell you the signal type — a TRS jack carries different things depending on the gear on each end. Balanced connections are standard in professional audio because they reject noise over long cable runs far better than unbalanced ones.</p>
          <figure class="split-grid">
            <div class="split-col">
              <h4>The Chain, In Order</h4>
              <ul>
                <li>Source (voice, instrument, DI)</li>
                <li>Preamp / gain stage</li>
                <li>Processing (EQ, dynamics)</li>
                <li>Routing / buses</li>
                <li>Output → amplifier → speaker</li>
              </ul>
            </div>
            <div class="split-col">
              <h4>Four Questions, Every Stage</h4>
              <ul>
                <li>Where is the signal right now?</li>
                <li>What's happening to it here?</li>
                <li>Where does it go next?</li>
                <li>How do I confirm it arrived?</li>
              </ul>
            </div>
          </figure>
        `

          <h2>Gain, Headroom, and Where the Signal Goes</h2>
          <div class="explainer">Gain structure connects almost everything else in this course — noise, distortion, headroom, and troubleshooting all trace back to it. The preamp sets a usable signal level for everything downstream; the channel fader doesn't fix a badly set input gain, it just makes a bad signal louder or quieter.</div>
          <p><strong>Headroom</strong> is the operating margin between a healthy signal and overload. There's no single meter number that works everywhere — meter scales and calibration differ by console — but the principle holds regardless: run low enough that peaks don't overload the path, and high enough that noise doesn't dominate.</p>
          <p>One input rarely feeds just one place. The same channel can go to the front-of-house mix, one or more monitor mixes, a recording or broadcast feed, and a matrix output, all at once and often at different points in the signal path. Understanding that a single source has multiple destinations is what makes buses and pre/post-fader routing make sense later.</p>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;">A stage box or snake carries multiple stage signals to the console and returns outputs to the stage — either as an analog snake or as stage I/O converted to digital audio and moved over a network. And know the difference between a <strong>powered</strong> loudspeaker, which has its own amplification built in, and a <strong>passive</strong> one, which needs an external amp — that changes where the signal path actually ends, and it changes what you check first when something goes quiet.</p>
          <div class="key-takeaway"><strong>Key principle:</strong> Set gain first, verify headroom, then remember that one input can feed several destinations at once.</div>
        `

          <h2>Reading a Console as Signal Flow</h2>
          <p>A console is a signal-routing and signal-processing environment. The vocabulary transfers between Yamaha, Allen &amp; Heath, Midas, DiGiCo, Soundcraft, and everything else you'll ever touch: input channel, preamp/gain, pad, phantom power, high-pass filter, EQ, dynamics, fader, mute, pan, PFL/AFL/solo/cue, aux/mix bus, group, main bus, monitor send, output master, patch, scene/snapshot, meter, headroom. Learn that vocabulary first. A specific console's layout is just where that vocabulary happens to live on that particular surface.</p>
          <div class="explainer">The order matters: <strong>configure the input → set gain → verify the signal → apply filtering or processing → route it → balance with faders.</strong> Input gain comes before mix balance, not after. A fader can't rescue a signal that was never set up correctly at the preamp.</div>
          <p>A high-pass filter and EQ are frequency-selective tools, not a magic fix for a bad sound. At this level, know boost versus cut, broad versus narrow adjustment, and why stacking too much processing on a channel tends to create a new problem instead of solving the first one. Detailed system tuning is its own skill — this course gives you the vocabulary and the reasoning, not a tuning credential.</p>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;">A fader and the input gain aren't the same control. <strong>Unity</strong> is the reference point where a fader neither boosts nor cuts relative to its calibrated path — exact workflow varies by console, but the concept holds everywhere.</p>
        `

          <h2>Buses, Routing, and PFL</h2>
          <p>A <strong>bus</strong> is a destination or combination path that channels get sent to — main L/R, a monitor aux, an effects send, a subgroup, a matrix output. Mixing is really just answering one question over and over: which input is going to which destination, and at what point in its channel path?</p>
          <div class="explainer">A <strong>pre-fader</strong> send stays independent of where the channel's main fader is sitting; a <strong>post-fader</strong> send follows that fader. That single distinction is the reason most monitor mixes and effects sends behave the way they do — get it backwards and a monitor mix moves every time someone rides the house fader.</div>
          <p><strong>PFL (pre-fader listen)</strong> does more work than any other single control on the console. It lets you hear and meter a channel before its fader, which means you can use it to verify a signal actually arrived, set gain correctly, and isolate noise or a fault — all without touching the house mix while you do it. Use PFL constantly, from your first console exercise through every troubleshooting scenario in this course.</p>

          <div class="key-takeaway"><strong>Key principle:</strong> PFL first. Verify before you adjust, and know whether a send is pre-fader or post-fader before you rely on it.</div>

          <h2>Troubleshooting by Signal Path</h2>
          <div class="explainer">Replace random knob-turning with a method: <strong>define the symptom precisely → decide local or global → recall the expected signal path → find a known-good point → verify one stage at a time → change one variable at a time → confirm the result → escalate when the fault is outside your authority or training.</strong> A <strong>local</strong> problem hits one or a few channels; a <strong>global</strong> problem hits the whole system — knowing which one you're dealing with changes where you start looking.</div>
          <p>Use the diagnostic ladder: <strong>source → cable/connection → stage I/O → input patch → preamp/gain → channel processing → channel routing → bus/master → output patch/processing → amplifier → loudspeaker.</strong> For a wireless source, insert <strong>transmitter → RF path → receiver → receiver audio output</strong> before the console. For networked audio, insert the digital transport and routing stage.</p>
          <p>Common no-signal causes: a wrong or failed cable, the wrong physical input selected, a muted channel, missing routing or assignment, a fader or master left down, a wrong digital patch, a condenser mic without the phantom power it needs, a powered device that isn't actually powered, or a wireless receiver with RF but no usable audio. The goal isn't memorizing that list — it's finding the last known-good point in the chain and working from there.</p>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;">Digital consoles add a failure mode analog gear doesn't have: the physical cable can be correct while the software patch isn't. <strong>Physical connection and logical routing are separate layers</strong> — checking one doesn't confirm the other.</p>
        `

          <h2>Feedback, Wireless, and Networked Audio</h2>
          <p>Feedback isn't "hear a squeal, grab the EQ." It's a loop — loudspeaker output re-enters an open microphone and gets amplified again and again. Work the loop in order: identify it, consider microphone and source placement, consider the mic-to-speaker geometry, consider excessive gain and unnecessary open microphones, consider the room's response, and only then use EQ carefully as part of the fix — never as a substitute for correcting an obvious physical problem. EQ can't repair a system-design or acoustic issue by itself.</p>
          <div class="explainer">A wireless signal path has <strong>two separate domains</strong>: <strong>source → transmitter → RF path → receiver → receiver audio output → console.</strong> A fault before or after the RF link isn't the same thing as an RF-coordination problem, and treating them the same wastes time chasing the wrong half of the chain.</div>
          <p>Networked audio — Dante and similar systems — means a stage box or console can be network-connected, with devices, channels, and routing configured in software like Dante Controller. At this level, know that network routing can be the reason a physically connected system has no audio, and that clocking and network state matter. Detailed IP addressing, VLAN design, and advanced network engineering are specialist skills that come later — this course gives you enough to understand what a network technician is looking at, not enough to configure the network yourself.</p>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;"><strong>Hearing safety:</strong> OSHA sets an 85 dBA 8-hour time-weighted-average action level that triggers hearing-conservation requirements, and a 90 dBA 8-hour permissible exposure limit. Follow your employer's and the site's hearing-protection rules, and escalate when exposure is uncertain rather than deciding it yourself from a phone app.</p>

          <h2>Quick Knowledge Check</h2>

            </div>
            <div class="coach" id="a2q5c"><strong>Why:</strong> Feedback is an acoustic loop. Work placement, geometry, and gain first — EQ is part of the fix, never a substitute for correcting an obvious physical cause.</div>

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const select = document.getElementById('mobileSelect');
  sidebar.innerHTML = '';
  select.innerHTML = '';

  modules.forEach(mod => {
    const modDiv = document.createElement('div');
    modDiv.innerHTML = `<div class="module-title">${mod.name}</div>`;

    mod.lessons.forEach(lesson => {
      const link = document.createElement('button');
      link.className = 'lesson-link';
      link.textContent = lesson.name;
      link.dataset.idx = lesson.id;
      link.onclick = () => render(lesson.id);
      modDiv.appendChild(link);

      const opt = document.createElement('option');
      opt.value = lesson.id;
      opt.textContent = `${mod.name} > ${lesson.name}`;
      select.appendChild(opt);
    });
    sidebar.appendChild(modDiv);
  });
}

function getModuleLesson(idx) {
  const [modIdx, lesIdx] = idx.split('.');
  const mod = modules.find(m => m.id === modIdx);
  const lesson = mod.lessons.find(l => l.id.endsWith('.' + lesIdx));
  return { mod, lesson };
}

function render(idx) {
  const { mod, lesson } = getModuleLesson(idx);
  document.getElementById('objective').textContent = lesson.obj;
  document.getElementById('lessonContent').innerHTML = lesson.content;
  document.querySelectorAll('.lesson-link').forEach(l => l.classList.remove('active'));
  const activeLink = document.querySelector(`[data-idx="${idx}"]`);
  if (activeLink) activeLink.classList.add('active');
  document.getElementById('mobileSelect').value = idx;

  const allLessons = [];
  modules.forEach(m => m.lessons.forEach(l => allLessons.push({ ...l, modId: m.id })));
  const currentIdx = allLessons.findIndex(l => l.id === lesson.id);

  document.querySelector('.progress-fill').style.width = ((currentIdx + 1) / allLessons.length) * 100 + '%';

  renderFooterNav(allLessons, currentIdx);
  window.scrollTo(0, 0);
}

function renderFooterNav(allLessons, currentIdx) {
  const nav = document.getElementById('footerNav');
  nav.innerHTML = '';

  if (currentIdx > 0) {
    const prev = allLessons[currentIdx - 1];
    const prevLink = document.createElement('a');
    prevLink.href = '#';
    prevLink.className = 'footer-nav-card';
    prevLink.innerHTML = `<span class="label">← Previous</span><h3>${prev.name}</h3>`;
    prevLink.onclick = e => { e.preventDefault(); render(prev.id); };
    nav.appendChild(prevLink);
  }

  if (currentIdx < allLessons.length - 1) {
    const next = allLessons[currentIdx + 1];
    const nextLink = document.createElement('a');
    nextLink.href = '#';
    nextLink.className = 'footer-nav-card';
    nextLink.innerHTML = `<span class="label">Next →</span><h3>${next.name}</h3>`;
    nextLink.onclick = e => { e.preventDefault(); render(next.id); };
    nav.appendChild(nextLink);
  }
}

buildSidebar();
render('1.1');
document.getElementById('mobileSelect').addEventListener('change', e => render(e.target.value));

document.getElementById('lessonContent').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn) return;
  const group = btn.closest('.options');
  if ([...group.children].some(x => x.disabled)) return;
  [...group.children].forEach(x => { x.disabled = true; if (x.dataset.c === '1') x.classList.add('correct'); });
  if (btn.dataset.c !== '1') btn.classList.add('incorrect');
  const coach = document.getElementById(group.dataset.q + 'c');
  if (coach) coach.classList.add('show');
});
</script>
