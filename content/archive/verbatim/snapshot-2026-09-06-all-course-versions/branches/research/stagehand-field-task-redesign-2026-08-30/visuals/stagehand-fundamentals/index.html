<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stagehand Fundamentals Visual Learning Set</title><style>:root{--bg:#0b0f14;--panel:#151b22;--card:#171d25;--border:#2b3440;--text:#f5f7fa;--muted:#9ba6b3;--gold:#f4b400;--warning:#f4b400}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.45}header{position:sticky;top:0;z-index:5;background:rgba(11,15,20,.96);border-bottom:1px solid var(--border);padding:18px 20px}h1{margin:0;color:var(--gold);font-size:clamp(24px,4vw,38px)}header p{margin:6px 0 0;color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}nav a{color:var(--gold);border:1px solid rgba(244,180,0,.35);padding:5px 9px;border-radius:999px;text-decoration:none;font-size:12px;transition:all 200ms}nav a:hover{background:rgba(244,180,0,.15)}.disclaimer{background:rgba(244,180,0,.1);border-left:3px solid var(--gold);padding:12px;margin:16px 0;border-radius:4px;font-size:13px;color:var(--muted)}disclaimer a{color:var(--gold)}main{max-width:1500px;margin:auto;padding:24px}.module{margin-bottom:54px;scroll-margin-top:150px}.module h2{color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}.card h3{margin:0 0 12px;font-size:18px}.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}.node{flex:1 1 120px;min-width:120px;background:var(--card);border:1px solid #3a4654;border-radius:10px;padding:12px;text-align:center}.node:last-child{border-color:var(--gold)}.node b{display:block;font-size:13px}.node span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.arrow{display:flex;align-items:center;color:var(--gold);font-weight:700}.rows{display:grid;gap:6px}.row{display:grid;grid-template-columns:minmax(110px,.8fr) 1.6fr;gap:10px;padding:8px;border-bottom:1px solid var(--border);background:var(--card);border-radius:8px}.row b{font-size:13px}.row span{font-size:12px;color:var(--muted)}.foot{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:600px){main{padding:14px}.arrow{display:none}.row{grid-template-columns:1fr}}</style></head><body><header><h1>Stagehand Fundamentals — Visual Learning Set</h1><p>All visual learning aids for Modules 1–10 on one page.</p><nav id="nav"></nav></header><main id="app"></main><script>const M=[

const nav=document.getElementById('nav'),app=document.getElementById('app');function renderVisual(v){const [title,items]=v;let inner;if(items.length<=5&&items.every(x=>x.length===2)){inner='<div class="flow">'+items.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div>'}else{inner='<div class="rows">'+items.map(x=>`<div class="row"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div>'}return `<article class="card"><h3>${title}</h3>${inner}</article>`}nav.insertAdjacentHTML('beforeend','<a href="bibliography.html">📚 Sources & References</a>');M.forEach(m=>{nav.insertAdjacentHTML('beforeend',`<a href="#m${m[0]}">Module ${m[0]}</a>`);app.insertAdjacentHTML('beforeend',`<section class="module" id="m${m[0]}"><h2>Module ${m[0]} — ${m[1]}</h2><div class="grid">${m[2].map(renderVisual).join('')}</div></section>`)});app.insertAdjacentHTML('afterbegin','<div class="disclaimer"><strong>Important:</strong> This course teaches general stagehand safety awareness aligned with OSHA standards and industry practices. Specific rules, tools, communication phrases, and procedures vary by <strong>employer, venue, union, and location</strong>. Always follow your assigned lead\'s instructions and your site\'s specific guidelines. This course does not replace employer training, union apprenticeship, certification, or site-specific instruction. <a href="bibliography.html">See sources & qualifications →</a></div>');app.insertAdjacentHTML('beforeend','<div class="foot">Crew Blueprint visual learning aids. These do not replace employer training, site-specific instruction, certification, or task authorization. <a href="bibliography.html">Full sources & bibliography →</a></div>');</script></body></html>
