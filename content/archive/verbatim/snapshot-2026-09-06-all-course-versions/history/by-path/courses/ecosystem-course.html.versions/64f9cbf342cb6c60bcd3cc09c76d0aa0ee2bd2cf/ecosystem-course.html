<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curriculum Course | The Crew Blueprint</title><meta name="description" content="Research-backed live-event production training from The Crew Blueprint."><link rel="icon" href="../images/logo.png" type="image/png"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#07090d;--panel:#0e1219;--panel2:#121823;--text:#f4f5f7;--muted:#a8b0bd;--gold:#f5b400;--line:#293140;--danger:#ffbf69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Inter,sans-serif}a{color:var(--gold)}.eco-shell{max-width:1060px;margin:auto;padding:30px 20px 90px}.eco-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0 24px;border-bottom:1px solid var(--line)}.eco-brand{font:700 20px Space Grotesk,sans-serif;color:var(--text);text-decoration:none}.eco-brand span{color:var(--gold)}.eco-top nav a{margin-left:16px;text-decoration:none}.eco-hero{padding:60px 0 30px}.eco-breadcrumb{color:var(--muted);font-size:13px;margin-bottom:20px}.eco-kicker{display:block;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.eco-hero h1{font:700 clamp(38px,7vw,72px)/.98 Space Grotesk,sans-serif;margin:12px 0 20px;max-width:900px}.eco-hero p{max-width:780px;color:var(--muted);font-size:18px}.eco-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.eco-meta span{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}.eco-evidence,.eco-lesson,.eco-quiz,.eco-next{margin:22px 0;padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.eco-evidence strong{display:block}.eco-evidence p,.eco-lesson>p,.eco-next p{color:var(--muted)}.eco-lesson h2,.eco-quiz h2,.eco-next h2{font:700 30px/1.15 Space Grotesk,sans-serif;margin:6px 0 12px}.eco-step{font-size:12px;color:var(--gold);font-weight:800;text-transform:uppercase}.eco-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.eco-grid article{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.eco-grid h3{font:700 17px Space Grotesk,sans-serif;margin:0 0 7px}.eco-grid p{margin:0;color:var(--muted);font-size:14px}.eco-stop,.eco-boundary{margin-top:18px;padding:16px;border-left:4px solid var(--danger);background:#17130d}.eco-boundary{border-color:var(--gold);background:#16140b}.eco-stop p,.eco-boundary p{margin:5px 0 0}.eco-quiz fieldset{border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:18px}.eco-quiz legend{font-weight:700;padding:0 8px}.eco-quiz label{display:block;padding:7px 0;color:var(--muted)}.eco-result{font-weight:700;color:var(--gold);margin-top:8px}.eco-btn{display:inline-block;border:0;border-radius:9px;background:var(--gold);color:#111;padding:11px 16px;font-weight:800;text-decoration:none;cursor:pointer}.eco-score{font-weight:700}.eco-next{text-align:center}@media(max-width:700px){.eco-grid{grid-template-columns:1fr}.eco-top{align-items:flex-start}.eco-top nav{display:flex;flex-direction:column}.eco-top nav a{margin:0 0 4px}.eco-evidence,.eco-lesson,.eco-quiz,.eco-next{padding:20px}}</style></head><body><div class="eco-shell"><header class="eco-top"><a class="eco-brand" href="../index.html">The Crew <span>Blueprint</span></a><nav><a href="../courses.html">Courses</a><a href="../curriculum-map.html">Full Curriculum</a></nav></header><main id="courseRoot"></main></div><script src="../js/ecosystem-courses.js"></script><script src="../js/ecosystem-normalize.js"></script><script src="../js/ecosystem-course.js"></script></body></html>
