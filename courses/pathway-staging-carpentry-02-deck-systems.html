        content: `
          <h2>What Makes a Staging System a System</h2>
          <div class="explainer">
            <p>Modular staging systems are product-specific. Wenger StageTek uses its own deck, leg, bracing, connector, and rail logic; Bil-Jax's AS2100 and ST8100 use different deck, rail, leg, bracing, and locking methods from each other. You can't carry a universal deck-locking sequence in your head and expect it to work on the next system. What transfers is the reasoning: <strong>what system is this? What does the build plan require? Which component am I handling? What's it for? What has the lead shown me? What should it look like when this step is done? What needs escalation instead of improvising?</strong></p>
          </div>
          <p>The <strong>deck</strong> is the walking/working surface — it comes in different sizes and ratings, and construction varies by manufacturer and by whether it's built for indoor or outdoor use. The deck is only one part of the support system, not the whole system by itself.</p>
          <p><strong>Legs, frames, and support elements</strong> aren't interchangeable generic pieces either — fixed-height legs, adjustable/telescoping legs, base pads, support frames, and manufacturer-specific leveling features all do different jobs. A stage can look level and solid while still being configured incorrectly. You can install the specific component you've been shown under direction; you don't invent a leveling workaround, omit a support, or change leg geometry on your own.</p>
          <figure class="split-grid">
            <div class="split-col">
              <h4>Connectors, Pins & Locks</h4>
              <ul>
                <li>Deck-to-deck connectors</li>
                <li>Leg-to-deck connections</li>
                <li>Braces, pins, clips</li>
                <li>Rail clamps/locks, stair hardware</li>
              </ul>
            </div>
            <div class="split-col">
              <h4>The Habit That Matters</h4>
              <ul>
                <li>"This looks similar" is not "this is correct for this system"</li>
                <li>Identify the system before you touch the hardware</li>
                <li>Different brands, different logic — every time</li>
              </ul>
            </div>
          </figure>
        `
      },
      {
        id: '1.2',
        name: 'Guardrails, Access, and Indoor vs. Outdoor Systems',
        obj: 'Treat guardrails and access components as safety-critical, and recognize what changes between indoor and outdoor staging.',
        content: `
          <h2>Guardrails, Access, and Indoor vs. Outdoor Systems</h2>
          <p><strong>Guardrails, handrails, chair stops, and edge protection</strong> aren't finishing accessories — they're safety-critical components. Rail systems are product-specific, they may carry load and height requirements, and stairs or ramps may need their own separate handrail system. A missing or incomplete edge condition is an escalation condition, full stop — you don't decide code applicability yourself. If a rail, stair, access point, or edge doesn't match the plan, stop and report it.</p>
          <p><strong>Stairs, ramps, and access systems</strong> are engineered, product-specific assemblies, not improvised pathways — recognize fixed versus adjustable stair assemblies, hook/bracket attachment concepts, and transition components as part of the complete system, without designing or approving them yourself. <strong>Risers</strong> — performer risers, drum risers, seated risers, camera/speaker platforms — show that the same component family can support very different load and use cases, which is exactly why the build plan governs configuration instead of intuition.</p>
          <div class="explainer">Course 1 taught you safe scenic handling. Here's the ownership layer: finished scenic pieces may carry painted or fragile surfaces, integrated hardware, or automation interfaces, and they may need a specific orientation or destination. Handle what you're assigned. Don't drill, cut, fasten, alter, repair, or re-engineer a scenic unit unless you're specifically trained and authorized for that task.</div>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;">Outdoor staging adds ground and weather awareness on top of everything indoor staging requires — settlement, uneven terrain, and weather can all change the safety context, and temporary outdoor structures need an approved plan and responsible oversight. Recognize common tools — wrenches, ratchets, hex keys, levels, tape measures, approved fasteners for the current system — but treat power saws, woodworking machinery, drilling, and fabrication as separate, competency-gated skills, not something you pick up just because it's common on a carpentry call.</p>
        `

        content: `
          <h2>How a Build Actually Flows</h2>
          <div class="explainer">There's no single universal truck-unload order — staging/carpentry workflow follows the pack and the plan, not a fixed category sequence. The department-level flow is: <strong>receive → identify → route → stage → verify → assemble → inspect/report → clear/reset.</strong></div>
          <p><strong>Receive and identify:</strong> confirm which pieces belong to your department, read labels/markings/build references where they're used, and keep complete assemblies together rather than separating matched hardware from the system it belongs to. Ask before you open, unbundle, or redistribute anything.</p>
          <p><strong>Route and stage:</strong> clear the intended route before moving large components, keep travel paths and emergency access clear, and place material where the next build step can actually reach it. Don't create unstable stacks or lean a heavy component insecurely, and don't stage material where lifts, forklifts, carts, or other crews need to travel.</p>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;">Large decks and rails justify a coordinated team carry, not solo improvisation. Designate who's leading the move, communicate before you lift or set down, protect your hands at mating edges and pinch points, keep the route visible, and stop the move the moment one person loses grip or footing.</p>
        `

        content: `
          <h2>Build-Zone Discipline and the Chain of Command</h2>
          <p>A staging/carpentry build creates its own temporary hazards: open edges, partially supported decks, loose pins or fasteners, protruding legs or braces, stacked rails, incomplete stairs, and tool/hardware trip hazards. Keep the work zone orderly and communicate an incomplete condition — don't assume everyone else can already see it.</p>
          <p>You should be able to read a basic build layout without acting like the designer: overall footprint, stage/riser dimensions, orientation, deck count, height changes, stair/ramp/access locations, rail locations, and component callouts. That's plan literacy, not structural calculation or independent change approval.</p>
          <div class="explainer">Current touring crew structures consistently show a <strong>Head Carpenter</strong> leading a department, with local take-in and put-out crews working under that leadership. A junior staging/carpentry worker participates in the department's workflow — assembling the system doesn't make you the department's authority, no matter how much of the physical work runs through your hands.</div>
          <div class="key-takeaway"><strong>Key principle:</strong> Keep the zone organized, read the plan you're given, and route structural or configuration questions to the lead — every time.</div>
        `

        id: '3.1',

          <h2>The Supervised Assembly Loop</h2>
          <div class="explainer">
            <p>This loop is safer and more transferable than memorizing one manufacturer's connection sequence: <strong>identify the system and current build step → confirm the correct component/hardware → watch or review the approved method → perform the assigned physical task → check the visible completion cue → don't force, substitute, or redesign → report completion or discrepancy to the lead.</strong></p>
          </div>
          <p>Visible completion cues you can learn to recognize: a component fully seated where it's designed to sit, a pin/clip/lock present where the plan calls for one, hardware visibly engaged rather than partially inserted, a guardrail or stair component attached in the intended location, no obvious missing support, and no loose component sitting where it becomes a trip or falling-object hazard. A visible cue is <strong>not</strong> structural certification — it tells you the step looks right, not that the system is approved for use.</p>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;">A common novice mistake is assuming resistance means "hit it harder." Do the opposite: if a component doesn't fit or lock the way you were shown, stop and verify the part, the orientation, and the connection against the build plan. Forcing a mismatched component can damage the equipment or create a connection that only looks complete.</p>
        `
      },

        id: '3.2',
        name: 'Bracing, Ground Conditions, and Who Signs Off',
        obj: 'Recognize bracing and load awareness as escalation territory, and know the three levels of inspection.',
        content: `
          <h2>Bracing, Ground Conditions, and Who Signs Off</h2>
          <p><strong>Bracing and support systems</strong> are structural, safety-critical elements governed by the system documentation and the build plan — you recognize bracing and follow instructions for it; you don't calculate or improvise it. <strong>Uneven ground and outdoor staging</strong> add another layer: ground condition and settlement matter, weather can change the safety context, and temporary outdoor structures need an approved plan and responsible oversight. You don't improvise anchoring, ballast, leveling, or structural modification.</p>
          <div class="explainer">Stages and platforms have load limits and intended configurations. An unsupported or incorrectly supported surface isn't acceptable just because it "feels solid," and you don't place heavy equipment wherever's convenient without direction. Any uncertainty about capacity or configuration gets escalated — you're not calculating load capacity yourself.</div>
          <p>Three levels of inspection matter, and Course 2 only covers the first two:</p>
          <ul class="cb-list">
            <li><strong>Level A — Worker self-check:</strong> "Did I perform the assigned step the way I was shown?"</li>
            <li><strong>Level B — Crew/lead verification:</strong> "Does this portion of the build match the plan and department procedure?"</li>
            <li><strong>Level C — Structural/code/final acceptance:</strong> "Is the completed system approved for use?" This stays with qualified, responsible authority — never a junior crew member's call.</li>
          </ul>
          <div class="key-takeaway"><strong>Key principle:</strong> Self-check your own step, know what the lead is verifying, and never mistake a system that looks finished for one that's been formally accepted.</div>
        `

      {
        id: '4.1',

        content: `
          <h2>Quick Knowledge Check</h2>
          <p>Pick an answer for each question.</p>

          <div class="quiz-block">
            <p class="quiz-q">You know how one manufacturer's staging system locks together. What's the safest assumption about a different brand?</p>
            <div class="options" data-q="s2q1">
              <button class="opt" data-c="0">It almost certainly works the same way.</button>
              <button class="opt" data-c="1">Identify the system in front of you and follow its own procedure.</button>
              <button class="opt" data-c="0">Try your familiar method first, then adjust if it doesn't fit.</button>
            </div>
            <div class="coach" id="s2q1c"><strong>Why:</strong> Different manufacturers use different deck, leg, bracing, and locking logic. "This looks similar" isn't the same as "this is correct for this system."</div>
          </div>

          <div class="quiz-block">
            <p class="quiz-q">A connector doesn't seat the way you were shown. What's the right move?</p>

          </div>

            <p class="quiz-q">A deck section looks level and solid once assembled. Does that mean it's structurally approved for use?</p>

            <p class="quiz-q">Materials are arriving for a build. What's the correct department workflow?</p>

              <button class="opt" data-c="0">Unload everything by category first, sort it out later.</button>
              <button class="opt" data-c="1">Receive → identify → route → stage → verify → assemble → inspect/report → clear/reset.</button>

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const select = document.getElementById('mobileSelect');
  sidebar.innerHTML = '';
  select.innerHTML = '';

  modules.forEach((mod, mi) => {
    const isActive = mod.lessons.some(l => l.id === current);
    const modHeader = document.createElement('div');
    modHeader.className = 'mod' + (isActive ? ' active' : '');
    modHeader.innerHTML = `<span class="num">${mi + 1}</span><div><div class="module-title">${mod.name}</div><div class="module-count">${mod.lessons.length} lessons</div></div>`;
    sidebar.appendChild(modHeader);

    const subDiv = document.createElement('div');
    subDiv.className = 'sub';
    mod.lessons.forEach(lesson => {
      const link = document.createElement('button');
      link.className = 'lesson-link' + (lesson.id === current ? ' active' : '');
      link.textContent = lesson.name;
      link.dataset.idx = lesson.id;
      link.onclick = () => render(lesson.id);
      subDiv.appendChild(link);

      const opt = document.createElement('option');
      opt.value = lesson.id;
      opt.textContent = `${mod.name} > ${lesson.name}`;
      select.appendChild(opt);
    });
    sidebar.appendChild(subDiv);
  });
}

function getModuleLesson(idx) {
  const [modIdx, lesIdx] = idx.split('.');
  const mod = modules.find(m => m.id === modIdx);
  const lesson = mod.lessons.find(l => l.id.endsWith('.' + lesIdx));
  return { mod, lesson };
}

let current = '1.1';

function render(idx) {
  current = idx;
  const { mod, lesson } = getModuleLesson(idx);
  document.getElementById('objective').textContent = lesson.obj;
  document.getElementById('lessonContent').innerHTML = lesson.content;
  document.getElementById('mobileSelect').value = idx;

  const allLessons = [];
  modules.forEach(m => m.lessons.forEach(l => allLessons.push({ ...l, modId: m.id })));
  const currentIdx = allLessons.findIndex(l => l.id === lesson.id);

  document.getElementById('progtext').textContent = `Lesson ${lesson.id} of ${allLessons.length}`;
  document.getElementById('pcttext').textContent = Math.round(((currentIdx + 1) / allLessons.length) * 100) + '%';
  document.getElementById('progbar').style.width = ((currentIdx + 1) / allLessons.length) * 100 + '%';

  renderFooterNav(allLessons, currentIdx);
  buildSidebar();
  window.scrollTo(0, 0);
}

function renderFooterNav(allLessons, currentIdx) {
  const nav = document.getElementById('footerNav');
  nav.innerHTML = '';

  if (currentIdx > 0) {
    const prev = allLessons[currentIdx - 1];
    const prevLink = document.createElement('a');
    prevLink.href = '#';
    prevLink.className = 'footer-nav-card';
    prevLink.innerHTML = `<span class="label">← Previous</span><h3>${prev.name}</h3>`;
    prevLink.onclick = e => { e.preventDefault(); render(prev.id); };
    nav.appendChild(prevLink);
  }

  if (currentIdx < allLessons.length - 1) {
    const next = allLessons[currentIdx + 1];
    const nextLink = document.createElement('a');
    nextLink.href = '#';
    nextLink.className = 'footer-nav-card';
    nextLink.innerHTML = `<span class="label">Next →</span><h3>${next.name}</h3>`;
    nextLink.onclick = e => { e.preventDefault(); render(next.id); };
    nav.appendChild(nextLink);
  }
}

buildSidebar();
render('1.1');
document.getElementById('mobileSelect').addEventListener('change', e => render(e.target.value));

document.getElementById('lessonContent').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn) return;
  const group = btn.closest('.options');
  if ([...group.children].some(x => x.disabled)) return;
  [...group.children].forEach(x => { x.disabled = true; if (x.dataset.c === '1') x.classList.add('correct'); });
  if (btn.dataset.c !== '1') btn.classList.add('incorrect');
  const coach = document.getElementById(group.dataset.q + 'c');
  if (coach) coach.classList.add('show');
});
</script>
