<head>

<title>Staging & Carpentry Pathway Course 1: Supporting Staging & Carpentry | The Crew Blueprint</title>
<meta name="description" content="Learn what a ground hand actually does to support deck, riser, and scenic build work without being treated as a scenic carpenter or staging lead." />
<link rel="icon" href="../images/logo.png" type="image/png">
<link rel="canonical" href="https://thecrewblueprint.com/courses/pathway-staging-carpentry-01-support/" />
<link href="https://fonts.googleapis.com" rel="preconnect" />

<style>
:root{--bg:#090c10;--panel:#121820;--panel2:#18212b;--text:#f1f4f7;--muted:#aab5c0;--line:#2b3641;--gold:#f5b400;--gold2:#ffd45a;--good:#39b979;--bad:#e26868;--info:#0284c7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#090c10,#0b0f14);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}.top{position:sticky;top:0;z-index:20;background:#090c10ee;border-bottom:1px solid var(--line)}.topin{max-width:1400px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{font-weight:900}.brand span,.eyebrow{color:var(--gold)}.small{font-size:.78rem;color:var(--muted)}.progbox{width:min(360px,45vw)}.progrow{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}.bar{height:8px;background:#222b34;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.shell{max-width:1400px;margin:auto;padding:22px 18px 60px}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.side{position:sticky;top:86px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;max-height:calc(100vh-100px);overflow-y:auto}.mod{display:flex;gap:10px;align-items:center;padding:9px;border-radius:11px;color:var(--muted);cursor:pointer;transition:all 200ms}.mod:hover{background:#1a2430}.mod.active{background:#211d0e;color:var(--text);border:1px solid #65551f}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#232c35;font-weight:800;font-size:12px}.active .num{background:var(--gold);color:#111}.sub{margin:8px 0 10px 23px;padding-left:13px;border-left:1px solid var(--line)}.sub button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:8px 0;cursor:pointer;font-size:13px;transition:color 200ms}.sub button:hover{color:var(--gold2)}.sub button.active{color:var(--gold2);font-weight:800}.hero,.card{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.hero h1{font-size:clamp(2rem,4vw,3rem);line-height:1.03;margin:.3rem 0}.hero p{color:var(--muted);max-width:880px}.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.13em;font-weight:900}.objective{border-left:4px solid var(--gold)}.visual-section{background:#0f1419;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:300px;overflow-x:auto}.visual-section svg{max-width:100%;height:auto;display:block}.visual-section img{max-width:100%;height:auto}.explainer{background:#0f1419;border-left:4px solid var(--info);padding:16px;border-radius:8px;margin-bottom:14px;font-size:14px;line-height:1.7;color:var(--text)}.explainer strong{color:var(--gold2)}.reference{background:#0f1419;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;font-size:13px}.reference strong{color:var(--gold2)}.reference ul{margin:8px 0;padding-left:20px}.reference li{margin:6px 0}.reference-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;font-weight:800}h3{margin:14px 0 8px 0;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#1b2530;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px}.mini strong{color:var(--gold2)}.quiz-q{font-weight:700;margin-bottom:10px}.options{display:grid;gap:10px}.opt{border:1px solid var(--line);background:#10151a;color:var(--text);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:13px;transition:all 200ms}.opt:hover:not(:disabled){border-color:var(--gold);background:#0f1a1f}.opt.correct{border-color:var(--good);background:#123026}.opt.incorrect{border-color:var(--bad);background:#321919}.opt:disabled{opacity:.7;cursor:not-allowed}.coach{display:none;margin-top:12px;padding:14px;border-left:4px solid var(--gold);background:#0e1419;border-radius:10px;font-size:13px;line-height:1.6}.coach.show{display:block}.coach strong{color:var(--gold2)}.rule{background:#211d0f;border:2px solid #66561f;padding:16px;border-radius:12px;text-align:center;font-weight:900;color:var(--gold2);margin-bottom:14px}.key-takeaway{background:#0e3a54;border:1px solid #1a5a7a;border-left:4px solid #0284c7;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;color:#e0f2fe}.key-takeaway strong{color:#0284c7}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:800;font-size:13px;transition:all 200ms}.btn:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--gold);color:#111}.primary:hover:not(:disabled){background:#ffc700;transform:translateY(-1px)}.secondary{background:#11161c;color:var(--text)}.secondary:hover:not(:disabled){background:#1a2430}.mobile{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:block;margin-bottom:12px}.mobile select{width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;font-size:13px}.grid2{grid-template-columns:1fr}.hero{padding:17px}.card{padding:17px}.actions{flex-direction:column-reverse}.btn{width:100%}.visual-section{min-height:200px}}
</style></head><body class="course-tier course-tier-department-support">
<header class="top"><div class="topin"><div><div class="brand">The Crew <span>Blueprint</span></div><div class="small">Staging &amp; Carpentry Pathway — Department Support Tier · Course 1: Supporting Staging &amp; Carpentry</div></div><div class="progbox"><div class="progrow"><span id="progtext">Lesson 1.1 of 6</span><span id="pct">17%</span></div><div class="bar"><i id="bar" style="width:17%"></i></div></div><a href="../courses.html" style="padding:8px 14px;background:rgba(0,0,0,0.4);border:1px solid #2b3641;border-radius:8px;color:#f1f4f7;font-size:12px;font-weight:800;text-decoration:none;transition:all 200ms;white-space:nowrap;">← Exit Course</a></div></header>
<div class="shell"><div class="mobile"><select id="mobile" style="width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;"></select></div><div class="layout">
<aside class="side" id="sidebar"></aside>
<main id="main"></main>
</div></div>

<script>
const modules = [
  {num:1,title:"Support Fundamentals",lessons:[
    {id:"1.1",name:"What You Can Help With",obj:"Recognize assembly labor as real, valuable work."},
    {id:"1.2",name:"What Stays Off-Limits",obj:"Understand structural authority and final acceptance."},
    {id:"1.3",name:"Common Mistakes & Awareness",obj:"Master the structural discipline of staging work."}
  ]},
  {num:2,title:"Knowledge Check",lessons:[
    {id:"2.1",name:"Quick Knowledge Check",obj:"Test your understanding of staging support."},
    {id:"2.2",name:"Key Takeaways",obj:"Solidify the principles of staging support."},
    {id:"2.3",name:"Sources & References",obj:"Explore the research behind staging safety."}
  ]}
];

let current = 0;
let total = modules.reduce((sum,m)=>sum+m.lessons.length,0);

function buildSidebar(){
  const s = document.getElementById('sidebar');
  let h='<div class="small" style="padding:5px 8px 10px;text-transform:uppercase;letter-spacing:.12em">Supporting Staging &amp; Carpentry</div>';
  modules.forEach((m,mi)=>{
    const isActive = current>=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0) && current<modules.slice(0,mi+1).reduce((s,x)=>s+x.lessons.length,0);
    h+=`<div class="mod ${isActive?'active':''}" onclick="goModule(${mi})"><span class="num">${m.num}</span><div><b>${m.title}</b><div class="small">${m.lessons.length} lessons</div></div></div>`;
    h+=`<div class="sub">`;
    m.lessons.forEach((l,li)=>{
      const idx = modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0)+li;
      h+=`<button class="nav ${idx===current?'active':''}" onclick="goLesson(${idx})">${l.id} ${l.name}</button>`;
    });
    h+=`</div>`;
  });
  s.innerHTML=h;
  buildMobileSelect();
}

function buildMobileSelect(){
  const m=document.getElementById('mobile');
  m.innerHTML='';
  let idx=0;
  modules.forEach(mod=>{
    mod.lessons.forEach(l=>{
      const opt=document.createElement('option');
      opt.value=idx;
      opt.textContent=`${l.id} ${l.name}`;
      if(idx===current)opt.selected=true;
      m.appendChild(opt);
      idx++;
    });
  });
  m.onchange=e=>goLesson(+e.target.value);
}

function getModuleLesson(idx){
  let count=0;
  for(let m of modules){
    if(count+m.lessons.length>idx)return [m,m.lessons[idx-count]];
    count+=m.lessons.length;
  }
  return [modules[0],modules[0].lessons[0]];
}

function goLesson(idx){
  current=Math.max(0,Math.min(idx,total-1));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goModule(mi){
  const idx=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0);
  goLesson(idx);
}

function render(){
  const [mod,lesson]=getModuleLesson(current);
  document.getElementById('progtext').textContent=`Lesson ${lesson.id} of ${total}`;
  document.getElementById('pct').textContent=Math.round((current+1)/total*100)+'%';
  document.getElementById('bar').style.width=(current+1)/total*100+'%';

  let html=`<section class="hero">
    <div class="eyebrow">Department Support Tier • Module ${mod.num} • Lesson ${lesson.id}</div>
    <h1>${lesson.name}</h1>
    <p><b>Objective:</b> ${lesson.obj}</p>
    <div class="rule">${lesson.obj}</div>
  </section>`;

  if(lesson.id==='1.1')html+=renderL11();
  else if(lesson.id==='1.2')html+=renderL12();
  else if(lesson.id==='1.3')html+=renderL13();
  else if(lesson.id==='2.1')html+=renderL21();
  else if(lesson.id==='2.2')html+=renderL22();
  else if(lesson.id==='2.3')html+=renderL23();

  html+=`<div class="actions">
    <button class="btn secondary" ${current===0?'disabled':''} onclick="goLesson(${current-1})">← Previous</button>
    <button class="btn primary" ${current===total-1?'disabled':''} onclick="goLesson(${current+1})">Next →</button>
  </div>`;

  document.getElementById('main').innerHTML=html;
  buildSidebar();
}

function renderL11(){
  return `<div class="card objective">
    <h3>What You Can Help With, Under Direction</h3>
    <div class="explainer">Assembly labor is real, valuable work — it just isn't the same thing as structural authority. You can move and stage deck sections, risers, stairs, guardrails, and scenic pieces exactly where the lead wants them, using a team carry for anything heavy or awkward. You can help assemble a modular staging system's assigned components — legs, sleeves, base pads, bracing, guardrail locks — once you've been shown that specific manufacturer's method; systems like Bil-Jax's AS2100 and ST8100 use different hardware from each other, so don't assume one system works like another. You can install guardrail or stair components under the lead's direction, follow a layout or drawing at the level you're assigned, and help strike, case, cart, and load the system afterward.</div>
  </div>
  <div class="card">
    <div class="grid2">
      <div class="mini"><strong>You Can Help With</strong>
        <ul>
          <li>Moving/staging decks, risers, stairs, guardrails</li>
          <li>Assembling assigned modular staging components</li>
          <li>Installing guardrail/stair components under direction</li>
          <li>Striking, casing, carting, loading the system</li>
        </ul>
      </div>
      <div class="mini"><strong>Stays Off-Limits</strong>
        <ul>
          <li>Cutting or altering deck/scenic components</li>
          <li>Drilling new attachment points</li>
          <li>Changing bracing or support geometry</li>
          <li>Deciding leveling, load capacity, final acceptance</li>
        </ul>
      </div>
    </div>
  </div>`;
}

function renderL12(){
  return `<div class="card objective">
    <h3>What Stays Off-Limits Without Direction</h3>
    <div class="explainer">The hand assembling a piece is not automatically the person authorized to decide its structural configuration.</div>
    <div class="reference"><span class="reference-label">An assembled deck isn't automatically a finished one</span>A platform can look solid with a component missing. Leveling, bracing decisions, load capacity, guardrail requirements, and final acceptance belong to the qualified lead — recognize obvious problems and report them instead of deciding they're fine.</div>
    <p style="color:var(--muted)">Cutting or altering deck/scenic components, drilling new attachment points, changing bracing or support geometry, substituting hardware, modifying stairs or guardrails, and repairing structural elements all stay off-limits without direction and specific training — regardless of how comfortable you are with tools. Scenic pieces are finished production assets, not construction lumber: follow handling instructions, don't drag finished faces or edges, and don't use scenic pieces as worktables.</p>
  </div>`;
}

function renderL13(){
  return `<div class="card objective">
    <h3>Common Mistakes and Structural Awareness</h3>
    <div class="explainer">The mistake to guard against isn't forgetting to lock the deck — it's assuming a familiar locking method applies to today's system. Identify the current product/system before you start, and follow the lead's or manufacturer's procedure for it. Clear the route before a carry, use enough people for the size and weight, communicate before lifting or setting down, and protect fingers at mating edges. Stage pieces so the next crew can access them without rehandling, and never leave a heavy section leaning or balanced insecurely.</div>
    <div class="reference"><span class="reference-label">Structural awareness without structural authority</span>Legs, frames, bracing, base pads, and connections all contribute to the intended configuration, and a missing component can change safety even if the deck "feels solid." Guardrails, stairs, and access points are part of the system, not cosmetic accessories — incorrectly installed handrails can cause serious injury. If the build doesn't match the instruction or something looks unsafe, stop and report it.</div>
  </div>`;
}

function renderL21(){
  return `<div class="card">
    <h3>Quick Knowledge Check</h3>
    <p>Pick an answer for each question.</p>

    <div class="quiz-q">You've assembled a deck section correctly. Does that mean you can decide it's safe to use?</div>
    <div class="options" data-q="sq1">
      <button class="opt" data-c="0">Yes — if it's assembled correctly, it's ready to use.</button>
      <button class="opt" data-c="1">No. Final leveling, load capacity, and acceptance are the qualified lead's call.</button>
      <button class="opt" data-c="0">Yes, as long as it doesn't wobble when you push on it.</button>
    </div>
    <div class="coach" id="sq1c"><strong>Why:</strong> An assembled deck isn't automatically a finished one. Recognize obvious problems and report them instead of deciding they're fine.</div>

    <div class="quiz-q" style="margin-top:20px">You know how one manufacturer's staging system locks together. Can you assume another brand works the same way?</div>
    <div class="options" data-q="sq2">
      <button class="opt" data-c="1">No. Identify the current system and follow its own procedure.</button>
      <button class="opt" data-c="0">Yes — modular staging hardware is standardized across brands.</button>
      <button class="opt" data-c="0">Yes, if the pieces look the same size.</button>
    </div>
    <div class="coach" id="sq2c"><strong>Why:</strong> Modular staging hardware is product-specific — systems like Bil-Jax's AS2100 and ST8100 use different hardware from each other. Don't assume one system works like another.</div>

    <div class="quiz-q" style="margin-top:20px">A guardrail component is missing from an otherwise-assembled platform. What do you do?</div>
    <div class="options" data-q="sq3">
      <button class="opt" data-c="0">Finish the rest of the assembly — the missing piece isn't urgent.</button>
      <button class="opt" data-c="0">Use whatever spare hardware is on hand to fill the gap.</button>
      <button class="opt" data-c="1">Stop and report it.</button>
    </div>
    <div class="coach" id="sq3c"><strong>Why:</strong> Guardrails, stairs, and access points are part of the system, not cosmetic accessories. Don't assume the deck is finished just because the surface is assembled.</div>

    <div class="quiz-q" style="margin-top:20px">You want to move a scenic piece faster. Can you drag it by a finished painted edge?</div>
    <div class="options" data-q="sq4">
      <button class="opt" data-c="0">Yes, as long as the edge looks sturdy.</button>
      <button class="opt" data-c="1">No. Ask where the piece can safely be gripped.</button>
      <button class="opt" data-c="0">Yes — it's faster and the paint can be touched up later.</button>
    </div>
    <div class="coach" id="sq4c"><strong>Why:</strong> Scenic pieces are finished production assets, not construction lumber. Don't drag finished faces or edges.</div>

    <div class="quiz-q" style="margin-top:20px">Can a ground hand substitute hardware if the correct piece isn't handy?</div>
    <div class="options" data-q="sq5">
      <button class="opt" data-c="0">Yes, if the substitute bolt or pin looks close enough in size.</button>
      <button class="opt" data-c="0">Yes, as long as you tell the lead afterward.</button>
      <button class="opt" data-c="1">No. Substituting hardware stays with qualified/authorized roles.</button>
    </div>
    <div class="coach" id="sq5c"><strong>Why:</strong> Substituting hardware, cutting, drilling, or modifying structural components changes the system's engineered configuration. That decision isn't a ground hand's to make.</div>
  </div>`;
}

function renderL22(){
  return `<div class="card">
    <h3>Key Takeaways</h3>
    <ul>
      <li>Move it, stage it, assemble the components you've been shown — under direction. Structural configuration and final acceptance stay with the lead.</li>
      <li>Modular staging hardware is product-specific; follow the current system's own procedure instead of assuming.</li>
      <li>Recognize obvious incomplete or unsafe conditions — missing rails, uneven support — and report them instead of deciding they're fine.</li>
      <li>Preserve finished scenic surfaces; ask where a piece can safely be gripped instead of guessing.</li>
    </ul>
    <div class="key-takeaway"><strong>Key principle:</strong> Move it, assemble it, and report what's missing — the structural call stays with the lead.</div>
  </div>`;
}

function renderL23(){
  return `<div class="card">
    <h3>Sources</h3>
    <div class="reference">
      <p>This course was built from research citing real crew postings, IATSE tour data, modular staging manufacturer documentation, and OSHA standards. Verify current applicability before relying on any of these for an actual job.</p>
      <ul>
        <li><strong>Live Nation — Union Stagehand</strong> — <a href="https://livenation.wd503.myworkdayjobs.com/en-US/LNExternalSite/job/Union-Stagehand--VB-Amphitheater-_JR-87529" target="_blank" rel="noopener noreferrer">livenation.wd503.myworkdayjobs.com</a></li>
        <li><strong>Bil-Jax Event Staging</strong> — <a href="https://biljax.com/product-category/event/event-staging" target="_blank" rel="noopener noreferrer">biljax.com</a></li>
        <li><strong>Bil-Jax AS2100 Aluminum Stage</strong> — <a href="https://biljax.com/product-category/event/event-staging/as2100" target="_blank" rel="noopener noreferrer">biljax.com</a></li>
        <li><strong>Bil-Jax ST8100 Steel Multi-Stage</strong> — <a href="https://biljax.com/product-category/event/event-staging/st8100" target="_blank" rel="noopener noreferrer">biljax.com</a></li>
        <li><strong>OSHA 29 CFR 1926.451 — General scaffold requirements</strong> — <a href="https://www.osha.gov/laws-regs/regulations/standardnumber/1926/1926.451" target="_blank" rel="noopener noreferrer">osha.gov</a></li>
        <li><strong>OSHA 29 CFR 1926.1431 — Hoisting personnel</strong> — <a href="https://www.osha.gov/laws-regs/regulations/standardnumber/1926/1926.1431" target="_blank" rel="noopener noreferrer">osha.gov</a></li>
      </ul>
    </div>
  </div>`;
}

buildSidebar();
render();

setInterval(()=>{
  document.querySelectorAll('.options').forEach(g=>{
    [...g.children].forEach(b=>b.onclick=()=>{
      if([...g.children].some(x=>x.disabled))return;
      [...g.children].forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('correct')});
      if(b.dataset.c!=='1')b.classList.add('incorrect');
      const cid=g.dataset.q+'c';
      const coach=document.getElementById(cid);
      if(coach)coach.classList.add('show');
    });
  });
},100);
</script>
</body>
</html>
