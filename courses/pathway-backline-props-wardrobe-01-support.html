<style>

(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.hero h1{font-size:clamp(2rem,4vw,3rem);line-height:1.03;margin:.3rem 0}.hero p{color:var(--muted);max-width:880px}.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.13em;font-weight:900}.objective{border-left:4px solid var(--gold)}.visual-section{background:#0f1419;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:300px;overflow-x:auto}.visual-section svg{max-width:100%;height:auto;display:block}.visual-section img{max-width:100%;height:auto}.explainer{background:#0f1419;border-left:4px solid var(--info);padding:16px;border-radius:8px;margin-bottom:14px;font-size:14px;line-height:1.7;color:var(--text)}.explainer strong{color:var(--gold2)}.reference{background:#0f1419;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;font-size:13px}.reference strong{color:var(--gold2)}.reference ul{margin:8px 0;padding-left:20px}.reference li{margin:6px 0}.reference-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;font-weight:800}h3{margin:14px 0 8px 0;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#1b2530;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px}.mini strong{color:var(--gold2)}.scale-level{padding:12px 14px;margin-bottom:8px;background:#1b2530;border-left:3px solid var(--gold);border-radius:8px}.scale-level strong{color:var(--gold2);display:block;font-size:13px;margin-bottom:2px}.scale-level span{color:var(--muted);font-size:13px}.quiz-q{font-weight:700;margin-bottom:10px}.options{display:grid;gap:10px}.opt{border:1px solid var(--line);background:#10151a;color:var(--text);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:13px;transition:all 200ms}.opt:hover:not(:disabled){border-color:var(--gold);background:#0f1a1f}.opt.correct{border-color:var(--good);background:#123026}.opt.incorrect{border-color:var(--bad);background:#321919}.opt:disabled{opacity:.7;cursor:not-allowed}.coach{display:none;margin-top:12px;padding:14px;border-left:4px solid var(--gold);background:#0e1419;border-radius:10px;font-size:13px;line-height:1.6}.coach.show{display:block}.coach strong{color:var(--gold2)}.rule{background:#211d0f;border:2px solid #66561f;padding:16px;border-radius:12px;text-align:center;font-weight:900;color:var(--gold2);margin-bottom:14px}.key-takeaway{background:#0e3a54;border:1px solid #1a5a7a;border-left:4px solid #0284c7;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;color:#e0f2fe}.key-takeaway strong{color:#0284c7}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:800;font-size:13px;transition:all 200ms}.btn:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--gold);color:#111}.primary:hover:not(:disabled){background:#ffc700;transform:translateY(-1px)}.secondary{background:#11161c;color:var(--text)}.secondary:hover:not(:disabled){background:#1a2430}.mobile{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:block;margin-bottom:12px}.mobile select{width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;font-size:13px}.grid2{grid-template-columns:1fr}.hero{padding:17px}.card{padding:17px}.actions{flex-direction:column-reverse}.btn{width:100%}.visual-section{min-height:200px}}

</style>
</head><body data-publication-state="owner-review-live" class="course-tier course-tier-department-support">
<div class="owner-review-badge" role="note">Owner Review · Public Audit Copy</div>
<header class="top"><div class="topin"><div><div class="brand">The Crew <span>Blueprint</span></div><div class="small">Backline, Props &amp; Wardrobe Pathway — Department Support Tier · Course 1: Ownership Sensitivity</div></div><div class="progbox"><div class="progrow"><span id="progtext">Lesson 1.1 of 6</span><span id="pct">17%</span></div><div class="bar"><i id="bar" style="width:17%"></i></div></div><a href="../courses.html" style="padding:8px 14px;background:rgba(0,0,0,0.4);border:1px solid #2b3641;border-radius:8px;color:#f1f4f7;font-size:12px;font-weight:800;text-decoration:none;transition:all 200ms;white-space:nowrap;">← Exit Course</a></div></header>
<div class="shell"><div class="mobile"><select id="mobile" style="width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;"></select></div><div class="layout">
<aside class="side" id="sidebar"></aside>
<main id="main"></main>
</div></div>

<script>
const modules = [
  {num:1,title:"Support Fundamentals",lessons:[
    {id:"1.1",name:"What You Can Help With",obj:"Master the labor of three different departments."},
    {id:"1.2",name:"The Ownership-Sensitivity Scale",obj:"Understand when to move something and when to ask."},
    {id:"1.3",name:"Common Mistakes & How to Ask",obj:"Learn the communication that earns you callbacks."}
  ]},
  {num:2,title:"Knowledge Check",lessons:[
    {id:"2.1",name:"Quick Knowledge Check",obj:"Test your understanding of ownership sensitivity."},
    {id:"2.2",name:"Key Takeaways",obj:"Remember the core principles across all three departments."},
    {id:"2.3",name:"Sources & References",obj:"Explore the research behind this course."}
  ]}
];

const requestedLesson = new URLSearchParams(window.location.search).get('lesson');
const lessonIds = modules.flatMap(module => module.lessons.map(lesson => lesson.id));
let current = Math.max(0,lessonIds.indexOf(requestedLesson));
let total = modules.reduce((sum,m)=>sum+m.lessons.length,0);

function syncCourseUrl(){
  const [,lesson]=getModuleLesson(current);
  const url=new URL(window.location.href);
  url.searchParams.set('lesson',lesson.id);
  window.history.replaceState(null,'',`${url.pathname}${url.search}${url.hash}`);
}

function buildSidebar(){
  const s = document.getElementById('sidebar');
  let h='<div class="small" style="padding:5px 8px 10px;text-transform:uppercase;letter-spacing:.12em">Ownership Sensitivity</div>';
  modules.forEach((m,mi)=>{
    const isActive = current>=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0) && current<modules.slice(0,mi+1).reduce((s,x)=>s+x.lessons.length,0);
    h+=`<div class="mod ${isActive?'active':''}" onclick="goModule(${mi})"><span class="num">${m.num}</span><div><b>${m.title}</b><div class="small">${m.lessons.length} lessons</div></div></div>`;
    h+=`<div class="sub">`;
    m.lessons.forEach((l,li)=>{
      const idx = modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0)+li;
      h+=`<button class="nav ${idx===current?'active':''}" onclick="goLesson(${idx})">${l.id} ${l.name}</button>`;
    });
    h+=`</div>`;
  });
  s.innerHTML=h;
  buildMobileSelect();
}

function buildMobileSelect(){
  const m=document.getElementById('mobile');
  m.innerHTML='';
  let idx=0;
  modules.forEach(mod=>{
    mod.lessons.forEach(l=>{
      const opt=document.createElement('option');
      opt.value=idx;
      opt.textContent=`${l.id} ${l.name}`;
      if(idx===current)opt.selected=true;
      m.appendChild(opt);
      idx++;
    });
  });
  m.onchange=e=>goLesson(+e.target.value);
}

function getModuleLesson(idx){
  let count=0;
  for(let m of modules){
    if(count+m.lessons.length>idx)return [m,m.lessons[idx-count]];
    count+=m.lessons.length;
  }
  return [modules[0],modules[0].lessons[0]];
}

function goLesson(idx){
  current=Math.max(0,Math.min(idx,total-1));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goModule(mi){
  const idx=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0);
  goLesson(idx);
}

function render(){
  const [mod,lesson]=getModuleLesson(current);
  syncCourseUrl();
  document.getElementById('progtext').textContent=`Lesson ${lesson.id} of ${total}`;
  document.getElementById('pct').textContent=Math.round((current+1)/total*100)+'%';
  document.getElementById('bar').style.width=(current+1)/total*100+'%';

  let html=`<section class="hero">
    <div class="eyebrow">Department Support Tier • Module ${mod.num} • Lesson ${lesson.id}</div>
    <h1>${lesson.name}</h1>
    <p><b>Objective:</b> ${lesson.obj}</p>
    <div class="rule">${lesson.obj}</div>
  </section>`;

  if(lesson.id==='1.1')html+=renderL11();
  else if(lesson.id==='1.2')html+=renderL12();
  else if(lesson.id==='1.3')html+=renderL13();
  else if(lesson.id==='2.1')html+=renderL21();
  else if(lesson.id==='2.2')html+=renderL22();
  else if(lesson.id==='2.3')html+=renderL23();

  html+=`<div class="actions">
    <button class="btn secondary" ${current===0?'disabled':''} onclick="goLesson(${current-1})">← Previous</button>
    <button class="btn primary" ${current===total-1?'disabled':''} onclick="goLesson(${current+1})">Next →</button>
  </div>`;

  document.getElementById('main').innerHTML=html;
  buildSidebar();
}

function renderL11(){
  return `<div class="card objective">
    <h3>What You Can Help With, Under Direction</h3>
    <div class="explainer">Backline, props, and wardrobe are separate crafts. A ground hand isn't any of them, but is useful to all three. For <strong>backline</strong>, you can move road cases from truck to staging area, place cases where the backline technician asks, help move drum risers, carry or position amp cabinets and hardware when assigned, and strike/re-case equipment in the order and method the technician directs. For <strong>props</strong>, you can unload and stage prop trunks/cases, carry or roll large props into the venue, move furniture or set-dressing under direction, and help with striking and re-packing once shown the correct method. For <strong>wardrobe</strong>, you can move closed trunks and racks from truck to the assigned area, help roll empty racks or cases, and move tables, mirrors, or work lights as directed — without opening or reorganizing what's inside. General production items — tables, chairs, signage, work lights, carts — are lower-risk and common ground-hand work across all three.</div>
  </div>`;
}

function renderL12(){
  return `<div class="card objective">
    <h3>What Stays Off-Limits Without Direction</h3>
    <div class="explainer">Think of it as a rising scale: general production item → department-owned gear → show-critical preset → performer-owned item. The higher up that scale, the more explicit the direction needs to be before you touch it.</div>
    <div class="reference"><span class="reference-label">Moving is labor. Changing is department work.</span>You can move a case, trunk, rack, or prop when assigned. That doesn't authorize you to change its settings, contents, preset location, packing method, or condition — those stay with the department unless you're specifically told otherwise.</div>
    <div class="scale-level"><strong>Level 1 — General Production Item</strong><span>Freely movable. Tables, chairs, work lights, signage, carts.</span></div>
    <div class="scale-level"><strong>Level 2 — Department-Owned Gear</strong><span>Move under direction. Equipment cases, road cases, speaker cabinets, racks.</span></div>
    <div class="scale-level"><strong>Level 3 — Show-Critical Preset</strong><span>Ask before moving. Items in exact positions for the show, props on set marks.</span></div>
    <div class="scale-level"><strong>Level 4 — Performer-Owned Item</strong><span>Explicit permission, every time. Instruments, clothing, personal equipment, shoes, wigs, accessories.</span></div>
    <p style="color:var(--muted);margin-top:12px">Never tune an instrument, change amp/pedal/keyboard/drum settings, or move an artist's instrument after it's been placed. Never move a prop from a preset position, substitute one prop for another, or repair/modify a prop — its exact location can be part of the show. Never open a wardrobe trunk, rearrange a costume preset, or handle performer-specific clothing, shoes, wigs, or accessories without wardrobe's direction. Stage weapons, pyrotechnic props, and other regulated items are never treated as ordinary props.</p>
  </div>`;
}

function renderL13(){
  return `<div class="card objective">
    <h3>Common Mistakes and How to Ask</h3>
    <div class="explainer">The novice mistake to prevent across all three departments is "cleaning up" something that was already exactly where it needed to be. Common problems: grabbing delicate equipment instead of a designated handle, stacking cases against their labels or obvious geometry, placing drinks or loose objects on instrument cases or wardrobe trunks, crushing garment bags under other gear, and assuming two similar-looking props are interchangeable. If you don't know whether something is preset, ask before moving it.</div>
    <div class="reference"><span class="reference-label">Useful phrases</span><strong>"Where do you want this staged?"</strong> · <strong>"Is this preset, or can I move it?"</strong> · <strong>"Do you want this opened or left closed?"</strong> · <strong>"I haven't handled this before — show me where to grab it."</strong> Asking first isn't passive — it's what makes you someone a department actually wants back.</div>
  </div>`;
}

function renderL21(){
  return `<div class="card">
    <h3>Quick Knowledge Check</h3>
    <p>Pick an answer for each question.</p>

    <div class="quiz-q">You've been asked to move a musician's amp. Can you also adjust the settings while you're at it?</div>
    <div class="options" data-q="bq1">
      <button class="opt" data-c="0">Yes, small adjustments save time later.</button>
      <button class="opt" data-c="1">No. Moving it is labor; changing its settings is backline's decision.</button>
      <button class="opt" data-c="0">Yes, as long as you remember the original settings.</button>
    </div>
    <div class="coach" id="bq1c"><strong>Why:</strong> Moving an assigned item where directed is labor. Changing its settings, contents, preset, or condition is department work unless you're specifically told otherwise.</div>

    <div class="quiz-q" style="margin-top:20px">A prop is sitting alone on a table backstage and looks out of place. Should you tidy it away?</div>
    <div class="options" data-q="bq2">
      <button class="opt" data-c="1">No. Ask before moving anything you think is a preset.</button>
      <button class="opt" data-c="0">Yes — clutter backstage is always a hazard to clear.</button>
      <button class="opt" data-c="0">Yes, and put it back if someone asks about it later.</button>
    </div>
    <div class="coach" id="bq2c"><strong>Why:</strong> Its exact location can be part of the show. A prop that looks out of place to you may be exactly where the show needs it.</div>

    <div class="quiz-q" style="margin-top:20px">You're moving a closed wardrobe trunk. Can you open it to check what's inside?</div>
    <div class="options" data-q="bq3">
      <button class="opt" data-c="0">Yes, so you know how to handle it properly.</button>
      <button class="opt" data-c="0">Yes, if you close it again exactly as you found it.</button>
      <button class="opt" data-c="1">No. Treat the closed trunk as freight and leave the contents to wardrobe.</button>
    </div>
    <div class="coach" id="bq3c"><strong>Why:</strong> Wardrobe contents are department work, not yours to check. Leave the trunk closed unless you're told otherwise.</div>

    <div class="quiz-q" style="margin-top:20px">What's the difference between "moving" and "changing" an item?</div>
    <div class="options" data-q="bq4">
      <button class="opt" data-c="0">There isn't one — both are the same level of responsibility.</button>
      <button class="opt" data-c="1">Moving an assigned item where directed is labor. Changing its settings, contents, preset, or condition is department work.</button>
      <button class="opt" data-c="0">Moving requires more training than changing something.</button>
    </div>
    <div class="coach" id="bq4c"><strong>Why:</strong> This is the core rule across backline, props, and wardrobe. You can carry, stage, and place an item under direction — but its configuration stays with the department that owns it.</div>

    <div class="quiz-q" style="margin-top:20px">According to the ownership-sensitivity scale, which requires the most explicit direction before you touch it?</div>
    <div class="options" data-q="bq5">
      <button class="opt" data-c="0">A general production item like a table or work light.</button>
      <button class="opt" data-c="0">Department-owned gear like a road case or speaker cabinet.</button>
      <button class="opt" data-c="1">A performer-owned item — instruments, clothing, personal equipment.</button>
    </div>
    <div class="coach" id="bq5c"><strong>Why:</strong> The scale rises from general production item to department gear to show-critical preset to performer-owned item. Performer-owned items sit at the top and need explicit permission every time.</div>
  </div>`;
}

function renderL22(){
  return `<div class="card">
    <h3>Key Takeaways</h3>
    <ul>
      <li>Backline, props, and wardrobe are separate crafts — useful ground-hand support looks different in each, but the underlying discipline is the same.</li>
      <li>Moving an assigned item is labor. Changing its settings, contents, preset, or condition is department work unless you're specifically told otherwise.</li>
      <li>Follow the ownership-sensitivity scale: general item → department gear → show-critical preset → performer-owned item — the higher up, the more explicit direction you need.</li>
      <li>When you don't know whether something is preset or personal, ask before you touch it.</li>
    </ul>
    <div class="key-takeaway"><strong>Key principle:</strong> Moving is labor. Changing is department work — know the difference before you touch anything.</div>
  </div>`;
}

function renderL23(){
  return `<div class="card">
    <h3>Sources</h3>
    <div class="reference">
      <p>This course was built from research citing real crew postings, IATSE touring data, and Playbill job listings for props and wardrobe roles. Verify current applicability before relying on any of these for an actual job.</p>
      <ul>
        <li><strong>PRG Crew Portal</strong> — <a href="https://crew.prg.com/en/" target="_blank" rel="noopener noreferrer">crew.prg.com</a></li>
        <li><strong>IATSE — An Introduction to Pink Contract Touring</strong> — <a href="https://iatse.net/about/stagecraft/touring-2/" target="_blank" rel="noopener noreferrer">iatse.net</a></li>
        <li><strong>IATSE — Spamalot National Tour</strong> — <a href="https://iatse.net/shows/spamalot-national-tour/" target="_blank" rel="noopener noreferrer">iatse.net</a></li>
        <li><strong>IATSE — Beauty and the Beast North American Tour</strong> — <a href="https://iatse.net/shows/beauty-and-the-beast-north-american-tour/" target="_blank" rel="noopener noreferrer">iatse.net</a></li>
        <li><strong>Playbill — Props Assistant</strong> — <a href="https://playbill.com/job/props-assistant-operation-mincemeat-tour/42db6305-b5c8-4dbf-91b7-13af5f8d780d" target="_blank" rel="noopener noreferrer">playbill.com</a></li>
        <li><strong>Playbill — Wardrobe & Hair Supervisor</strong> — <a href="https://playbill.com/job/wardrobe-hair-supervisor/d569fe64-ef51-45c4-8619-0ffcd07e081c" target="_blank" rel="noopener noreferrer">playbill.com</a></li>
      </ul>
    </div>
  </div>`;
}

buildSidebar();
render();

setInterval(()=>{
  document.querySelectorAll('.options').forEach(g=>{
    [...g.children].forEach(b=>b.onclick=()=>{
      if([...g.children].some(x=>x.disabled))return;
      [...g.children].forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('correct')});
      if(b.dataset.c!=='1')b.classList.add('incorrect');
      const cid=g.dataset.q+'c';
      const coach=document.getElementById(cid);
      if(coach)coach.classList.add('show');
    });
  });
},100);
</script>
</body>
</html>
