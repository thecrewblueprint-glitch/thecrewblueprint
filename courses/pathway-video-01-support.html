<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Pathway Course 1: Supporting an LED Video Wall Build | The Crew Blueprint</title>
<meta name="description" content="Learn how to safely help build, handle, and strike an LED video wall without becoming a video engineer overnight." />
<link rel="icon" href="../images/logo.png" type="image/png">
<link rel="canonical" href="https://thecrewblueprint.com/courses/pathway-video-01-support/" />
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--cb-bg); color: var(--cb-text); line-height: 1.6; }
  :root {
    --cb-bg: #050606;
    --cb-text: #f5f5f5;
    --cb-muted: #b3b3b3;
    --cb-muted-2: #808080;
    --cb-card: #0f1112;
    --cb-border: #1a1d20;
    --cb-gold: #f5b400;
    --cb-gold-strong: #f5b400;
    --cb-panel: #0a0b0d;
    --cb-radius-md: 8px;
    --cb-radius-lg: 12px;
  }

  .top { position: fixed; top: 0; left: 0; right: 0; height: 72px; background: var(--cb-bg); border-bottom: 1px solid var(--cb-border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; }
  .top-left { display: flex; align-items: center; gap: 16px; }
  .top-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .top-actions { display: flex; gap: 12px; }
  .progbox { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
  .progrow { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--cb-muted-2); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--cb-panel); border: 1px solid var(--cb-border); border-radius: var(--cb-radius-md); font-size: 14px; font-weight: 600; color: var(--cb-text); cursor: pointer; text-decoration: none; transition: all 180ms ease; }
  .btn:hover { border-color: var(--cb-gold); color: var(--cb-gold); }
  .progress-bar { position: fixed; top: 72px; left: 0; right: 0; height: 3px; background: var(--cb-border); z-index: 99; }
  .progress-fill { height: 100%; background: var(--cb-gold); width: 0%; transition: width 300ms ease; }

  .shell { display: grid; grid-template-columns: 240px 1fr; gap: 0; padding-top: 72px; min-height: 100vh; }
  .side { position: fixed; top: 72px; left: 0; width: 240px; height: calc(100vh - 72px); background: var(--cb-card); border-right: 1px solid var(--cb-border); overflow-y: auto; padding: 24px 0; z-index: 50; }
  .side-nav { display: grid; gap: 0; }
  .side-mod { padding: 0; }
  .side-mod-title { display: block; padding: 12px 24px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cb-muted-2); }
  .side-lesson { display: block; padding: 10px 24px; font-size: 13px; color: var(--cb-muted); text-decoration: none; border-left: 2px solid transparent; transition: all 180ms ease; }
  .side-lesson:hover { color: var(--cb-gold); border-left-color: var(--cb-gold); }
  .side-lesson.active { color: var(--cb-gold); border-left-color: var(--cb-gold); font-weight: 600; }

  .main { grid-column: 2; padding-left: 0; }
  .hero { padding: clamp(32px, 6vw, 60px) clamp(20px, 6vw, 60px); background: var(--cb-panel); border-bottom: 1px solid var(--cb-border); }
  .hero h1 { font-size: clamp(32px, 5vw, 48px); margin: 0 0 16px; line-height: 1.1; letter-spacing: -0.03em; }
  .hero p { font-size: clamp(16px, 2vw, 18px); color: var(--cb-muted); margin: 0; max-width: 700px; line-height: 1.65; }

  .card { margin: 24px clamp(20px, 6vw, 60px) 0; padding: 22px; background: var(--cb-card); border: 1px solid var(--cb-border); border-radius: var(--cb-radius-md); }
  .card.progress { position: sticky; top: 90px; margin-top: 24px; z-index: 40; }
  .rule { font-size: 14px; font-weight: 700; color: var(--cb-gold); background: rgba(245, 180, 0, 0.08); padding: 12px; border-radius: 6px; border-left: 3px solid var(--cb-gold); }

  .content { padding: clamp(20px, 6vw, 60px); }
  .content h2 { font-size: clamp(24px, 4vw, 32px); margin: 32px 0 16px 0; line-height: 1.2; }
  .content h2:first-child { margin-top: 0; }
  .content p { color: var(--cb-muted); margin: 0 0 16px 0; line-height: 1.7; }
  .content ul { color: var(--cb-muted); margin: 16px 0; padding-left: 24px; }
  .content li { margin: 8px 0; }
  .content a { color: var(--cb-gold); text-decoration: none; }
  .content a:hover { text-decoration: underline; }

  .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
  .split-col { padding: 18px; background: rgba(5, 7, 8, 0.5); border: 1px solid var(--cb-border); border-radius: var(--cb-radius-md); }
  .split-col h4 { font-size: 14px; font-weight: 700; margin: 0 0 12px; color: var(--cb-gold); }
  .split-col ul { margin: 0; padding-left: 20px; }
  .split-col li { font-size: 13px; margin: 6px 0; }

  .quiz-block { margin: 14px 0 22px; }
  .quiz-q { font-weight: 700; color: var(--cb-text); margin-bottom: 10px; }
  .options { display: grid; gap: 10px; }
  .opt { border: 1px solid var(--cb-border); background: var(--cb-panel); color: var(--cb-text); border-radius: var(--cb-radius-md); padding: 12px 14px; text-align: left; cursor: pointer; font-size: 14px; transition: all 180ms ease; }
  .opt:hover:not(:disabled) { border-color: var(--cb-gold); background: var(--cb-card); }
  .opt.correct { border-color: #39b979; background: rgba(57,185,121,0.12); }
  .opt.incorrect { border-color: #e26868; background: rgba(226,104,104,0.12); }
  .opt:disabled { opacity: 0.75; cursor: not-allowed; }
  .coach { display: none; margin-top: 12px; padding: 14px; border-left: 3px solid var(--cb-gold); background: var(--cb-panel); border-radius: 8px; font-size: 14px; line-height: 1.6; color: var(--cb-muted); }
  .coach.show { display: block; }
  .coach strong { color: var(--cb-gold-strong); }

  .footer-nav { display: grid; gap: 16px; margin: 40px 0 60px 0; }
  .footer-nav-card { padding: 20px; background: var(--cb-card); border: 1px solid var(--cb-border); border-radius: var(--cb-radius-md); text-decoration: none; color: inherit; transition: all 180ms ease; display: block; }
  .footer-nav-card:hover { border-color: var(--cb-gold); }
  .footer-nav-card .label { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cb-muted-2); display: block; margin-bottom: 6px; }
  .footer-nav-card h3 { margin: 0; font-size: 18px; }

  .mobile-select { display: none; }
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { grid-column: 1; }
    .mobile-select { display: block; margin: 0 0 16px 0; width: 100%; padding: 12px; background: var(--cb-card); border: 1px solid var(--cb-border); border-radius: var(--cb-radius-md); color: var(--cb-text); font-size: 14px; font-weight: 600; cursor: pointer; }
    .split-grid { grid-template-columns: 1fr; }
    .top { flex-direction: column; height: auto; padding: 12px 16px; gap: 12px; }
    .top-left { flex-direction: column; width: 100%; }
    .top-title { font-size: 16px; }
    .progress-bar { top: auto; }
    .top-actions { width: 100%; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-left">
    <div class="top-title">Supporting an LED Video Wall Build</div>
  </div>
  <div class="progbox">
    <div class="progrow"><span id="progtext">Lesson 1 of 1</span><span id="pct">0%</span></div>
  </div>
  <div class="top-actions">
    <a href="../courses.html" class="btn">← Exit Course</a>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill"></div></div>

<div class="shell">
  <nav class="side">
    <div class="side-nav" id="sidebar"></div>
  </nav>

  <div class="main">
    <select class="mobile-select" id="mobileSelect"></select>
    <div class="hero">
      <h1>Supporting an LED Video Wall Build</h1>
      <p>LED walls are some of the most fragile, expensive gear on a call. Learn how to protect that gear while helping build it — not to become a video engineer overnight.</p>
    </div>

    <div class="card progress" id="progressCard">
      <div class="rule" id="objective">Select a lesson to begin</div>
    </div>

    <div class="content" id="lessonContent"></div>

    <div class="footer-nav" id="footerNav"></div>
  </div>
</div>

<script>
const modules = [
  {
    id: '1',
    name: 'Support Fundamentals',
    lessons: [
      {
        id: '1.1',
        name: 'What You Can Help With',
        obj: 'Master the physical logistics of LED wall support.',
        content: `
          <h2>What You Can Help With, Under Direction</h2>
          <p>Real ground-hand support on an LED wall build is physical logistics and repeatable mechanical assistance — genuinely useful, and genuinely safe when done right.</p>
          <p>You can move cases and dollies into position, carry cabinets using the product's actual handles, hold a cabinet steady while the lead engages a lock, repeat a locking step once someone's shown you how, and move cable and connectors under direction. During strike, each cabinet goes back to the exact case, slot, and orientation it came from — not an ad-hoc pile.</p>
          <figure class="split-grid">
            <div class="split-col split-can">
              <h4>You Can Help With</h4>
              <ul>
                <li>Moving cases and dollies into position</li>
                <li>Carrying cabinets by their actual handles</li>
                <li>Holding a cabinet steady for locking</li>
                <li>Moving cable and connectors under direction</li>
              </ul>
            </div>
            <div class="split-col split-cant">
              <h4>Stays Off-Limits</h4>
              <ul>
                <li>Touching or pressing the LED face</li>
                <li>Processor configuration</li>
                <li>Calibration and receiving-card work</li>
                <li>Diagnosing or fixing a damaged panel</li>
              </ul>
            </div>
          </figure>
        `
      },
      {
        id: '1.2',
        name: 'Learn the System, Not the Brand',
        obj: 'Understand why different LED brands require completely different approaches.',
        content: `
          <h2>Don't Memorize the Wall — Learn the Pattern</h2>
          <p>This is the single most important idea in this course.</p>
          <div class="card" style="background: rgba(245, 180, 0, 0.08); border: 1px solid rgba(245, 180, 0, 0.32); margin: 16px 0;">
            <strong style="color: var(--cb-gold-strong); display: block; margin-bottom: 8px;">Different LED brands lock, connect, and store completely differently</strong>
            <p style="margin: 0; color: var(--cb-muted);">There's no one universal method, and assuming a wall works like the last one you built is exactly how gear gets damaged. Learn the system in front of you: how it locks, what connector it uses, how it's cased. The transferable skill is protecting the equipment and following the current lead's procedure — not memorizing one brand.</p>
          </div>
          <p>This applies to handling, too. "Carry it by the edges" isn't a safe universal rule — edges can hold alignment hardware, curve mechanisms, and locking hardware that are easy to damage. Use the handles the product is actually built with.</p>
        `
      },
      {
        id: '1.3',
        name: 'What Stays Off-Limits',
        obj: 'Know the boundaries of LED wall support work.',
        content: `
          <h2>What Stays Off-Limits Without Direction</h2>
          <p>The face of the wall is the one thing you never touch, no matter how confident you are with the rest of the build.</p>
          <p>Never touch, press, or lean on the LED face itself — the pixels are delicate and on some panels are static-sensitive. Processor configuration, calibration, receiving-card work, and troubleshooting all stay with the video/LED lead. If a panel looks dark, damaged, or wrong, report it — don't try to diagnose or fix it yourself.</p>
          <p style="margin-top: 12px; color: var(--cb-muted); font-size: 14px;">Common ways LED gear gets damaged by ground hands: touching or pressing the LED face, letting magnet-assisted panels snap together uncontrolled instead of guiding them in deliberately, forcing a lock before panels are properly aligned, forcing a connector that doesn't seat normally, and losing control of a cabinet's weight during a carry or strike.</p>
        `
      }
    ]
  },
  {
    id: '2',
    name: 'Knowledge Check',
    lessons: [
      {
        id: '2.1',
        name: 'Quick Knowledge Check',
        obj: 'Verify your understanding of LED wall support.',
        content: `
          <h2>Quick Knowledge Check</h2>
          <p>Pick an answer for each question.</p>

          <div class="quiz-block">
            <p class="quiz-q">You've built one brand of LED wall before. Does that mean you know how the next one locks and cases?</p>
            <div class="options" data-q="vq1">
              <button class="opt" data-c="0">Yes — locking mechanisms are basically the same across brands.</button>
              <button class="opt" data-c="1">No. Different brands lock, connect, and store completely differently.</button>
              <button class="opt" data-c="0">Yes, as long as the panel size looks similar.</button>
            </div>
            <div class="coach" id="vq1c"><strong>Why:</strong> Assuming a wall works like the last one you built is exactly how gear gets damaged. Learn the system in front of you: how it locks, what connector it uses, how it's cased.</div>
          </div>

          <div class="quiz-block">
            <p class="quiz-q">Can you touch the LED face directly, carefully, while positioning a cabinet?</p>
            <div class="options" data-q="vq2">
              <button class="opt" data-c="0">Yes, as long as you're gentle and only touch the edge pixels.</button>
              <button class="opt" data-c="0">Yes, if you're wearing gloves.</button>
              <button class="opt" data-c="1">No. Never touch, press, or lean on the LED face — use the actual handles.</button>
            </div>
            <div class="coach" id="vq2c"><strong>Why:</strong> The pixels are delicate and on some panels are static-sensitive. The face is the one thing you never touch, no matter how confident you are with the rest of the build.</div>
          </div>

          <div class="quiz-block">
            <p class="quiz-q">An LED panel looks dark or damaged mid-build. What do you do?</p>
            <div class="options" data-q="vq3">
              <button class="opt" data-c="0">Pull it and swap it with a spare yourself.</button>
              <button class="opt" data-c="0">Tap it a few times to see if it reconnects.</button>
              <button class="opt" data-c="1">Report it to the video/LED lead.</button>
            </div>
            <div class="coach" id="vq3c"><strong>Why:</strong> Diagnosing or fixing a damaged panel is outside a ground hand's role. Report it and let the lead decide what happens next.</div>
          </div>

          <div class="quiz-block">
            <p class="quiz-q">Two panels are approaching each other with magnet-assisted alignment. What's the right technique?</p>
            <div class="options" data-q="vq4">
              <button class="opt" data-c="0">Let the magnets pull them together on their own — that's what they're for.</button>
              <button class="opt" data-c="1">Guide them together deliberately — don't let them snap together uncontrolled.</button>
              <button class="opt" data-c="0">Push them together quickly before the magnets can misalign them.</button>
            </div>
            <div class="coach" id="vq4c"><strong>Why:</strong> An uncontrolled magnet snap can damage the LEDs on impact. Guide the panels in with control instead of letting the magnets do the last part of the work.</div>
          </div>

          <div class="quiz-block">
            <p class="quiz-q">Where does each cabinet go during strike?</p>
            <div class="options" data-q="vq5">
              <button class="opt" data-c="0">Into whichever case has room left.</button>
              <button class="opt" data-c="1">Back into the exact case, slot, and orientation it came from.</button>
              <button class="opt" data-c="0">Stacked by size, largest cabinets first.</button>
            </div>
            <div class="coach" id="vq5c"><strong>Why:</strong> Cases are built around a specific packing plan. An improvised stack risks damage in transit and slows the next load-in trying to figure out what goes where.</div>
          </div>
        `
      },
      {
        id: '2.2',
        name: 'Key Takeaways',
        obj: 'Remember the core principles of LED wall support.',
        content: `
          <h2>Key Takeaways</h2>
          <ul style="margin: 16px 0; color: var(--cb-muted); list-style: disc; padding-left: 24px;">
            <li>Real LED wall support: moving cases, carrying by intended handles, holding cabinets while locks engage, cable/connector discipline, correct strike/casing.</li>
            <li>Different brands lock, connect, and store completely differently — learn the current system, don't assume it matches the last one.</li>
            <li>Never touch the LED face. Processor configuration, calibration, and troubleshooting stay with the video/LED lead.</li>
            <li>Most damage comes from handling mistakes: uncontrolled magnet snaps, forced locks, forced connectors, losing control of cabinet weight.</li>
          </ul>
        `
      },
      {
        id: '2.3',
        name: 'Sources & References',
        obj: 'Explore the research supporting this course.',
        content: `
          <h2>Sources</h2>
          <p>This course was built from research citing real crew postings, manufacturer product/handling documentation, and OSHA standards. Verify current applicability before relying on any of these for an actual job.</p>
          <ul style="margin: 16px 0; color: var(--cb-muted); list-style: none; padding-left: 0;">
            <li style="margin: 10px 0;"><strong>PRG Crew Portal</strong> — <a href="https://crew.prg.com/en/" target="_blank" rel="noopener noreferrer">crew.prg.com</a></li>
            <li style="margin: 10px 0;"><strong>4Wall — Video Department Technician</strong> — <a href="https://www.4wall.com/about/careers/862-video-department-technician" target="_blank" rel="noopener noreferrer">4wall.com</a></li>
            <li style="margin: 10px 0;"><strong>Absen LED panel documentation</strong> — <a href="https://www.absen.com/product/pl-v2-series/" target="_blank" rel="noopener noreferrer">absen.com</a></li>
            <li style="margin: 10px 0;"><strong>ROE Visual Ruby-C documentation</strong> — <a href="https://www.roevisual.com/en/ruby-c" target="_blank" rel="noopener noreferrer">roevisual.com</a></li>
            <li style="margin: 10px 0;"><strong>Neutrik locking connector documentation</strong> — <a href="https://www.neutrik.com/en/product/ne8fbh-c5" target="_blank" rel="noopener noreferrer">neutrik.com</a></li>
            <li style="margin: 10px 0;"><strong>OSHA 29 CFR 1910.132 — PPE</strong> — <a href="https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.132" target="_blank" rel="noopener noreferrer">osha.gov</a></li>
            <li style="margin: 10px 0;"><strong>OSHA 29 CFR 1910.176 — Materials Handling</strong> — <a href="https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.176" target="_blank" rel="noopener noreferrer">osha.gov</a></li>
          </ul>
        `
      }
    ]
  }
];

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const select = document.getElementById('mobileSelect');
  sidebar.innerHTML = '';
  select.innerHTML = '';

  modules.forEach(mod => {
    const modDiv = document.createElement('div');
    modDiv.className = 'side-mod';
    modDiv.innerHTML = `<div class="side-mod-title">${mod.name}</div>`;

    mod.lessons.forEach(lesson => {
      const link = document.createElement('a');
      link.href = '#';
      link.className = 'side-lesson';
      link.textContent = lesson.name;
      link.dataset.idx = `${mod.id}.${lesson.id.split('.')[1]}`;
      link.onclick = e => { e.preventDefault(); render(link.dataset.idx); };
      modDiv.appendChild(link);

      const opt = document.createElement('option');
      opt.value = `${mod.id}.${lesson.id.split('.')[1]}`;
      opt.textContent = `${mod.name} > ${lesson.name}`;
      select.appendChild(opt);
    });
    sidebar.appendChild(modDiv);
  });
}

function getModuleLesson(idx) {
  const [modIdx, lesIdx] = idx.split('.');
  const mod = modules.find(m => m.id === modIdx);
  const lesson = mod.lessons.find(l => l.id.endsWith(lesIdx));
  return { mod, lesson };
}

function render(idx) {
  const { mod, lesson } = getModuleLesson(idx);
  document.getElementById('objective').textContent = lesson.obj;
  document.getElementById('lessonContent').innerHTML = lesson.content;
  document.querySelectorAll('.side-lesson').forEach(l => l.classList.remove('active'));
  document.querySelector(`[data-idx="${idx}"]`).classList.add('active');
  document.getElementById('mobileSelect').value = idx;

  const totalLessons = modules.reduce((sum, m) => sum + m.lessons.length, 0);
  let currentLesson = 0;
  modules.forEach(m => m.lessons.forEach(l => { currentLesson++; if (l.id === lesson.id) return; }));
  let count = 0;
  modules.forEach(m => m.lessons.forEach(l => { count++; if (l.id === lesson.id) currentLesson = count; }));

  const progress = (currentLesson / totalLessons) * 100;
  document.querySelector('.progress-fill').style.width = progress + '%';
  document.getElementById('progtext').textContent = `Lesson ${currentLesson} of ${totalLessons}`;
  document.getElementById('pct').textContent = Math.round(progress) + '%';

  renderFooterNav(mod, lesson, idx);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderFooterNav(mod, lesson, idx) {
  const nav = document.getElementById('footerNav');
  nav.innerHTML = '';

  const allLessons = [];
  modules.forEach(m => m.lessons.forEach(l => allLessons.push({...l, modId: m.id})));
  const currentIdx = allLessons.findIndex(l => l.id === lesson.id);

  if (currentIdx > 0) {
    const prev = allLessons[currentIdx - 1];
    const prevLink = document.createElement('a');
    prevLink.href = '#';
    prevLink.className = 'footer-nav-card';
    prevLink.innerHTML = `<span class="label">← Previous</span><h3>${prev.name}</h3>`;
    prevLink.onclick = e => { e.preventDefault(); render(`${prev.modId}.${prev.id.split('.')[1]}`); };
    nav.appendChild(prevLink);
  }

  if (currentIdx < allLessons.length - 1) {
    const next = allLessons[currentIdx + 1];
    const nextLink = document.createElement('a');
    nextLink.href = '#';
    nextLink.className = 'footer-nav-card';
    nextLink.innerHTML = `<span class="label">Next →</span><h3>${next.name}</h3>`;
    nextLink.onclick = e => { e.preventDefault(); render(`${next.modId}.${next.id.split('.')[1]}`); };
    nav.appendChild(nextLink);
  }
}

buildSidebar();
render('1.1');
document.getElementById('mobileSelect').addEventListener('change', e => render(e.target.value));

document.getElementById('lessonContent').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn) return;
  const group = btn.closest('.options');
  if ([...group.children].some(x => x.disabled)) return;
  [...group.children].forEach(x => { x.disabled = true; if (x.dataset.c === '1') x.classList.add('correct'); });
  if (btn.dataset.c !== '1') btn.classList.add('incorrect');
  const coach = document.getElementById(group.dataset.q + 'c');
  if (coach) coach.classList.add('show');
});
</script>

</body>
</html>
