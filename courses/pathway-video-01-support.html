<style>

(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.hero h1{font-size:clamp(2rem,4vw,3rem);line-height:1.03;margin:.3rem 0}.hero p{color:var(--muted);max-width:880px}.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.13em;font-weight:900}.objective{border-left:4px solid var(--gold)}.visual-section{background:#0f1419;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:300px;overflow-x:auto}.visual-section svg{max-width:100%;height:auto;display:block}.visual-section img{max-width:100%;height:auto}.explainer{background:#0f1419;border-left:4px solid var(--info);padding:16px;border-radius:8px;margin-bottom:14px;font-size:14px;line-height:1.7;color:var(--text)}.explainer strong{color:var(--gold2)}.reference{background:#0f1419;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;font-size:13px}.reference strong{color:var(--gold2)}.reference ul{margin:8px 0;padding-left:20px}.reference li{margin:6px 0}.reference-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;font-weight:800}h3{margin:14px 0 8px 0;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#1b2530;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px}.mini strong{color:var(--gold2)}.quiz-q{font-weight:700;margin-bottom:10px}.options{display:grid;gap:10px}.opt{border:1px solid var(--line);background:#10151a;color:var(--text);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:13px;transition:all 200ms}.opt:hover:not(:disabled){border-color:var(--gold);background:#0f1a1f}.opt.correct{border-color:var(--good);background:#123026}.opt.incorrect{border-color:var(--bad);background:#321919}.opt:disabled{opacity:.7;cursor:not-allowed}.coach{display:none;margin-top:12px;padding:14px;border-left:4px solid var(--gold);background:#0e1419;border-radius:10px;font-size:13px;line-height:1.6}.coach.show{display:block}.coach strong{color:var(--gold2)}.rule{background:#211d0f;border:2px solid #66561f;padding:16px;border-radius:12px;text-align:center;font-weight:900;color:var(--gold2);margin-bottom:14px}.key-takeaway{background:#0e3a54;border:1px solid #1a5a7a;border-left:4px solid #0284c7;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;color:#e0f2fe}.key-takeaway strong{color:#0284c7}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:800;font-size:13px;transition:all 200ms}.btn:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--gold);color:#111}.primary:hover:not(:disabled){background:#ffc700;transform:translateY(-1px)}.secondary{background:#11161c;color:var(--text)}.secondary:hover:not(:disabled){background:#1a2430}.mobile{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:block;margin-bottom:12px}.mobile select{width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;font-size:13px}.grid2{grid-template-columns:1fr}.hero{padding:17px}.card{padding:17px}.actions{flex-direction:column-reverse}.btn{width:100%}.visual-section{min-height:200px}}

</style>

</head><body data-publication-state="owner-review-live" class="course-tier course-tier-department-support">
<div class="owner-review-badge" role="note">Owner Review · Public Audit Copy</div>
<header class="top"><div class="topin"><div><div class="brand">The Crew <span>Blueprint</span></div><div class="small">Video Pathway — Department Support Tier · Course 1: Supporting an LED Video Wall Build</div></div><div class="progbox"><div class="progrow"><span id="progtext">Lesson 1.1 of 6</span><span id="pct">17%</span></div><div class="bar"><i id="bar" style="width:17%"></i></div></div><a href="../courses.html" style="padding:8px 14px;background:rgba(0,0,0,0.4);border:1px solid #2b3641;border-radius:8px;color:#f1f4f7;font-size:12px;font-weight:800;text-decoration:none;transition:all 200ms;white-space:nowrap;">← Exit Course</a></div></header>
<div class="shell"><div class="mobile"><select id="mobile" style="width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;"></select></div><div class="layout">
<aside class="side" id="sidebar"></aside>
<main id="main"></main>
</div></div>

<script>
const modules = [
  {num:1,title:"Support Fundamentals",lessons:[
    {id:"1.1",name:"What You Can Help With",obj:"Master the physical logistics of LED wall support."},
    {id:"1.2",name:"Learn the System, Not the Brand",obj:"Understand why different LED brands require completely different approaches."},
    {id:"1.3",name:"What Stays Off-Limits",obj:"Know the boundaries of LED wall support work."}
  ]},
  {num:2,title:"Knowledge Check",lessons:[
    {id:"2.1",name:"Quick Knowledge Check",obj:"Verify your understanding of LED wall support."},
    {id:"2.2",name:"Key Takeaways",obj:"Remember the core principles of LED wall support."},
    {id:"2.3",name:"Sources & References",obj:"Explore the research supporting this course."}
  ]}
];

const requestedLesson = new URLSearchParams(window.location.search).get('lesson');
const lessonIds = modules.flatMap(module => module.lessons.map(lesson => lesson.id));
let current = Math.max(0,lessonIds.indexOf(requestedLesson));
let total = modules.reduce((sum,m)=>sum+m.lessons.length,0);

function syncCourseUrl(){
  const [,lesson]=getModuleLesson(current);
  const url=new URL(window.location.href);
  url.searchParams.set('lesson',lesson.id);
  window.history.replaceState(null,'',`${url.pathname}${url.search}${url.hash}`);
}

function buildSidebar(){
  const s = document.getElementById('sidebar');
  let h='<div class="small" style="padding:5px 8px 10px;text-transform:uppercase;letter-spacing:.12em">Supporting an LED Video Wall Build</div>';
  modules.forEach((m,mi)=>{
    const isActive = current>=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0) && current<modules.slice(0,mi+1).reduce((s,x)=>s+x.lessons.length,0);
    h+=`<div class="mod ${isActive?'active':''}" onclick="goModule(${mi})"><span class="num">${m.num}</span><div><b>${m.title}</b><div class="small">${m.lessons.length} lessons</div></div></div>`;
    h+=`<div class="sub">`;
    m.lessons.forEach((l,li)=>{
      const idx = modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0)+li;
      h+=`<button class="nav ${idx===current?'active':''}" onclick="goLesson(${idx})">${l.id} ${l.name}</button>`;
    });
    h+=`</div>`;
  });
  s.innerHTML=h;
  buildMobileSelect();
}

function buildMobileSelect(){
  const m=document.getElementById('mobile');
  m.innerHTML='';
  let idx=0;
  modules.forEach(mod=>{
    mod.lessons.forEach(l=>{
      const opt=document.createElement('option');
      opt.value=idx;
      opt.textContent=`${l.id} ${l.name}`;
      if(idx===current)opt.selected=true;
      m.appendChild(opt);
      idx++;
    });
  });
  m.onchange=e=>goLesson(+e.target.value);
}

function getModuleLesson(idx){
  let count=0;
  for(let m of modules){
    if(count+m.lessons.length>idx)return [m,m.lessons[idx-count]];
    count+=m.lessons.length;
  }
  return [modules[0],modules[0].lessons[0]];
}

function goLesson(idx){
  current=Math.max(0,Math.min(idx,total-1));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goModule(mi){
  const idx=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0);
  goLesson(idx);
}

function render(){
  const [mod,lesson]=getModuleLesson(current);
  syncCourseUrl();
  document.getElementById('progtext').textContent=`Lesson ${lesson.id} of ${total}`;
  document.getElementById('pct').textContent=Math.round((current+1)/total*100)+'%';
  document.getElementById('bar').style.width=(current+1)/total*100+'%';

  let html=`<section class="hero">
    <div class="eyebrow">Department Support Tier • Module ${mod.num} • Lesson ${lesson.id}</div>
    <h1>${lesson.name}</h1>
    <p><b>Objective:</b> ${lesson.obj}</p>
    <div class="rule">${lesson.obj}</div>
  </section>`;

  if(lesson.id==='1.1')html+=renderL11();
  else if(lesson.id==='1.2')html+=renderL12();
  else if(lesson.id==='1.3')html+=renderL13();
  else if(lesson.id==='2.1')html+=renderL21();
  else if(lesson.id==='2.2')html+=renderL22();
  else if(lesson.id==='2.3')html+=renderL23();

  html+=`<div class="actions">
    <button class="btn secondary" ${current===0?'disabled':''} onclick="goLesson(${current-1})">← Previous</button>
    <button class="btn primary" ${current===total-1?'disabled':''} onclick="goLesson(${current+1})">Next →</button>
  </div>`;

  document.getElementById('main').innerHTML=html;
  buildSidebar();
}

function renderL11(){
  return `<div class="card objective">
    <h3>What You Can Help With, Under Direction</h3>
    <div class="explainer">Real ground-hand support on an LED wall build is physical logistics and repeatable mechanical assistance — genuinely useful, and genuinely safe when done right. You can move cases and dollies into position, carry cabinets using the product's actual handles, hold a cabinet steady while the lead engages a lock, repeat a locking step once someone's shown you how, and move cable and connectors under direction. During strike, each cabinet goes back to the exact case, slot, and orientation it came from — not an ad-hoc pile.</div>
  </div>
  <div class="card">
    <div class="grid2">
      <div class="mini"><strong>You Can Help With</strong>
        <ul>
          <li>Moving cases and dollies into position</li>
          <li>Carrying cabinets by their actual handles</li>
          <li>Holding a cabinet steady for locking</li>
          <li>Moving cable and connectors under direction</li>
        </ul>
      </div>
      <div class="mini"><strong>Stays Off-Limits</strong>
        <ul>
          <li>Touching or pressing the LED face</li>
          <li>Processor configuration</li>
          <li>Calibration and receiving-card work</li>
          <li>Diagnosing or fixing a damaged panel</li>
        </ul>
      </div>
    </div>
  </div>`;
}

function renderL12(){
  return `<div class="card objective">
    <h3>Don't Memorize the Wall — Learn the Pattern</h3>
    <div class="explainer">This is the single most important idea in this course.</div>
    <div class="reference"><span class="reference-label">Different LED brands lock, connect, and store completely differently</span>There's no one universal method, and assuming a wall works like the last one you built is exactly how gear gets damaged. Learn the system in front of you: how it locks, what connector it uses, how it's cased. The transferable skill is protecting the equipment and following the current lead's procedure — not memorizing one brand.</div>
    <p style="color:var(--muted)">This applies to handling, too. "Carry it by the edges" isn't a safe universal rule — edges can hold alignment hardware, curve mechanisms, and locking hardware that are easy to damage. Use the handles the product is actually built with.</p>
  </div>`;
}

function renderL13(){
  return `<div class="card objective">
    <h3>What Stays Off-Limits Without Direction</h3>
    <div class="explainer">The face of the wall is the one thing you never touch, no matter how confident you are with the rest of the build. Never touch, press, or lean on the LED face itself — the pixels are delicate and on some panels are static-sensitive. Processor configuration, calibration, receiving-card work, and troubleshooting all stay with the video/LED lead. If a panel looks dark, damaged, or wrong, report it — don't try to diagnose or fix it yourself.</div>
    <div class="reference"><span class="reference-label">Common ways LED gear gets damaged by ground hands</span>Touching or pressing the LED face, letting magnet-assisted panels snap together uncontrolled instead of guiding them in deliberately, forcing a lock before panels are properly aligned, forcing a connector that doesn't seat normally, and losing control of a cabinet's weight during a carry or strike.</div>
  </div>`;
}

function renderL21(){
  return `<div class="card">
    <h3>Quick Knowledge Check</h3>
    <p>Pick an answer for each question.</p>

    <div class="quiz-q">You've built one brand of LED wall before. Does that mean you know how the next one locks and cases?</div>
    <div class="options" data-q="vq1">
      <button class="opt" data-c="0">Yes — locking mechanisms are basically the same across brands.</button>
      <button class="opt" data-c="1">No. Different brands lock, connect, and store completely differently.</button>
      <button class="opt" data-c="0">Yes, as long as the panel size looks similar.</button>
    </div>
    <div class="coach" id="vq1c"><strong>Why:</strong> Assuming a wall works like the last one you built is exactly how gear gets damaged. Learn the system in front of you: how it locks, what connector it uses, how it's cased.</div>

    <div class="quiz-q" style="margin-top:20px">Can you touch the LED face directly, carefully, while positioning a cabinet?</div>
    <div class="options" data-q="vq2">
      <button class="opt" data-c="0">Yes, as long as you're gentle and only touch the edge pixels.</button>
      <button class="opt" data-c="0">Yes, if you're wearing gloves.</button>
      <button class="opt" data-c="1">No. Never touch, press, or lean on the LED face — use the actual handles.</button>
    </div>
    <div class="coach" id="vq2c"><strong>Why:</strong> The pixels are delicate and on some panels are static-sensitive. The face is the one thing you never touch, no matter how confident you are with the rest of the build.</div>

    <div class="quiz-q" style="margin-top:20px">An LED panel looks dark or damaged mid-build. What do you do?</div>
    <div class="options" data-q="vq3">
      <button class="opt" data-c="0">Pull it and swap it with a spare yourself.</button>
      <button class="opt" data-c="0">Tap it a few times to see if it reconnects.</button>
      <button class="opt" data-c="1">Report it to the video/LED lead.</button>
    </div>
    <div class="coach" id="vq3c"><strong>Why:</strong> Diagnosing or fixing a damaged panel is outside a ground hand's role. Report it and let the lead decide what happens next.</div>

    <div class="quiz-q" style="margin-top:20px">Two panels are approaching each other with magnet-assisted alignment. What's the right technique?</div>
    <div class="options" data-q="vq4">
      <button class="opt" data-c="0">Let the magnets pull them together on their own — that's what they're for.</button>
      <button class="opt" data-c="1">Guide them together deliberately — don't let them snap together uncontrolled.</button>
      <button class="opt" data-c="0">Push them together quickly before the magnets can misalign them.</button>
    </div>
    <div class="coach" id="vq4c"><strong>Why:</strong> An uncontrolled magnet snap can damage the LEDs on impact. Guide the panels in with control instead of letting the magnets do the last part of the work.</div>

    <div class="quiz-q" style="margin-top:20px">Where does each cabinet go during strike?</div>
    <div class="options" data-q="vq5">
      <button class="opt" data-c="0">Into whichever case has room left.</button>
      <button class="opt" data-c="1">Back into the exact case, slot, and orientation it came from.</button>
      <button class="opt" data-c="0">Stacked by size, largest cabinets first.</button>
    </div>
    <div class="coach" id="vq5c"><strong>Why:</strong> Cases are built around a specific packing plan. An improvised stack risks damage in transit and slows the next load-in trying to figure out what goes where.</div>
  </div>`;
}

function renderL22(){
  return `<div class="card">
    <h3>Key Takeaways</h3>
    <ul>
      <li>Real LED wall support: moving cases, carrying by intended handles, holding cabinets while locks engage, cable/connector discipline, correct strike/casing.</li>
      <li>Different brands lock, connect, and store completely differently — learn the current system, don't assume it matches the last one.</li>
      <li>Never touch the LED face. Processor configuration, calibration, and troubleshooting stay with the video/LED lead.</li>
      <li>Most damage comes from handling mistakes: uncontrolled magnet snaps, forced locks, forced connectors, losing control of cabinet weight.</li>
    </ul>
    <div class="key-takeaway"><strong>Key principle:</strong> Learn the system in front of you — not the brand you remember.</div>
  </div>`;
}

function renderL23(){
  return `<div class="card">
    <h3>Sources</h3>
    <div class="reference">
      <p>This course was built from research citing real crew postings, manufacturer product/handling documentation, and OSHA standards. Verify current applicability before relying on any of these for an actual job.</p>
      <ul>
        <li><strong>PRG Crew Portal</strong> — <a href="https://crew.prg.com/en/" target="_blank" rel="noopener noreferrer">crew.prg.com</a></li>
        <li><strong>4Wall — Video Department Technician</strong> — <a href="https://www.4wall.com/about/careers/862-video-department-technician" target="_blank" rel="noopener noreferrer">4wall.com</a></li>
        <li><strong>Absen LED panel documentation</strong> — <a href="https://www.absen.com/product/pl-v2-series/" target="_blank" rel="noopener noreferrer">absen.com</a></li>
        <li><strong>ROE Visual Ruby-C documentation</strong> — <a href="https://www.roevisual.com/en/ruby-c" target="_blank" rel="noopener noreferrer">roevisual.com</a></li>
        <li><strong>Neutrik locking connector documentation</strong> — <a href="https://www.neutrik.com/en/product/ne8fbh-c5" target="_blank" rel="noopener noreferrer">neutrik.com</a></li>
        <li><strong>OSHA 29 CFR 1910.132 — PPE</strong> — <a href="https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.132" target="_blank" rel="noopener noreferrer">osha.gov</a></li>
        <li><strong>OSHA 29 CFR 1910.176 — Materials Handling</strong> — <a href="https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.176" target="_blank" rel="noopener noreferrer">osha.gov</a></li>
      </ul>
    </div>
  </div>`;
}

buildSidebar();
render();

setInterval(()=>{
  document.querySelectorAll('.options').forEach(g=>{
    [...g.children].forEach(b=>b.onclick=()=>{
      if([...g.children].some(x=>x.disabled))return;
      [...g.children].forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('correct')});
      if(b.dataset.c!=='1')b.classList.add('incorrect');
      const cid=g.dataset.q+'c';
      const coach=document.getElementById(cid);
      if(coach)coach.classList.add('show');
    });
  });
},100);
</script>
<script src="../js/course-consent.js"></script>
</body>
</html>
