(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.hero h1{font-size:clamp(2rem,4vw,3rem);line-height:1.03;margin:.3rem 0}.hero p{color:var(--muted);max-width:880px}.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.13em;font-weight:900}.lesson{display:none}.lesson.active{display:block}.objective{border-left:4px solid var(--gold)}.visual-section{background:#0f1419;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:300px;overflow-x:auto}.visual-section svg{max-width:100%;height:auto;display:block}.visual-section img{max-width:100%;height:auto}.explainer{background:#0f1419;border-left:4px solid var(--info);padding:16px;border-radius:8px;margin-bottom:14px;font-size:14px;line-height:1.7;color:var(--text)}.explainer strong{color:var(--gold2)}.reference{background:#0f1419;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;font-size:13px}.reference strong{color:var(--gold2)}.reference ul{margin:8px 0;padding-left:20px}.reference li{margin:6px 0}.reference-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;font-weight:800}h3{margin:14px 0 8px 0;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#1b2530;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px}.mini strong{color:var(--gold2)}.options{display:grid;gap:10px}.opt{border:1px solid var(--line);background:#10151a;color:var(--text);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:13px;transition:all 200ms}.opt:hover:not(:disabled){border-color:var(--gold);background:#0f1a1f}.opt.correct{border-color:var(--good);background:#123026}.opt.incorrect{border-color:var(--bad);background:#321919}.opt:disabled{opacity:.7;cursor:not-allowed}.coach{display:none;margin-top:12px;padding:14px;border-left:4px solid var(--gold);background:#0e1419;border-radius:10px;font-size:13px;line-height:1.6}.coach.show{display:block}.coach strong{color:var(--gold2)}.rule{background:#211d0f;border:2px solid #66561f;padding:16px;border-radius:12px;text-align:center;font-weight:900;color:var(--gold2);margin-bottom:14px}.key-takeaway{background:#0e3a54;border:1px solid #1a5a7a;border-left:4px solid #0284c7;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;color:#e0f2fe}.key-takeaway strong{color:#0284c7}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:800;font-size:13px;transition:all 200ms}.btn:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--gold);color:#111}.primary:hover:not(:disabled){background:#ffc700;transform:translateY(-1px)}.secondary{background:#11161c;color:var(--text)}.secondary:hover:not(:disabled){background:#1a2430}.mobile{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:block;margin-bottom:12px}.mobile select{width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;font-size:13px}.grid2{grid-template-columns:1fr}.hero{padding:17px}.card{padding:17px}.actions{flex-direction:column-reverse}.btn{width:100%}.visual-section{min-height:200px}}
</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">The Crew <span>Blueprint</span></div><div class="small">Stagehand Fundamentals — Comprehensive Learning Course</div></div><div class="progbox"><div class="progrow"><span id="progtext">Module 1.1 of 40</span><span id="pct">2%</span></div><div class="bar"><i id="bar" style="width:2%"></i></div></div></div></header>
<div class="shell"><div class="mobile"><select id="mobile" style="width:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;"></select></div><div class="layout">
<aside class="side" id="sidebar"></aside>
<main id="main"></main>
</div></div>

<script>
const modules = [
  {num:1,title:"Welcome to Live Event World",lessons:[
    {id:"1.1",name:"The Job & The Room",obj:"Recognize how environment changes risk."},
    {id:"1.2",name:"The Shape of a Call",obj:"Understand the three-phase structure."},
    {id:"1.3",name:"Crew, Direction & Value",obj:"Identify who leads and what matters."},
    {id:"1.4",name:"First-Call Integration",obj:"Apply Module 1 concepts in context."}
  ],rule:"SHOW UP READY. KNOW WHO IS LEADING YOU. FOLLOW DIRECTION. ASK BEFORE YOU GUESS. WORK SAFELY."},
  {num:2,title:"Safety Mindset Before Skillset",lessons:[
    {id:"2.1",name:"Hazard vs. Risk vs. Behavior",obj:"Distinguish three related concepts."},
    {id:"2.2",name:"Notice & Classify",obj:"Apply the NCCE decision model."},
    {id:"2.3",name:"Under Pressure",obj:"Keep safety judgment active."},
    {id:"2.4",name:"Hazard Integration",obj:"Identify hazards in complex scenes."}
  ],rule:"SEE THE HAZARD. THINK ABOUT THE RISK. CONTROL YOUR BEHAVIOR. SPEAK UP BEFORE IT BECOMES AN INCIDENT."},
  {num:3,title:"PPE, Clothing & Readiness",lessons:[
    {id:"3.1",name:"Context-Dependent Prep",obj:"Match PPE to task and environment."},
    {id:"3.2",name:"Site Requirements",obj:"Understand non-negotiable PPE."},
    {id:"3.3",name:"Phase Transitions",obj:"Adapt PPE and clothing to context."}
  ],rule:"PREPARE FOR THE CALL YOU HAVE — CLOTHING, PPE, GEAR, FOOD, REST, AND TRANSPORT ALL COUNT AS JOB READINESS."},
  {num:4,title:"Venue & Jobsite Awareness",lessons:[
    {id:"4.1",name:"Orient First",obj:"Know the first-15-minute sequence."},
    {id:"4.2",name:"Read the Space",obj:"Navigate using venue vocabulary."},
    {id:"4.3",name:"Hazard Recognition",obj:"Spot multiple hazards in scenes."}
  ],rule:"ORIENT FIRST. KNOW WHERE YOU ARE, WHO IS LEADING YOU, WHAT IS MOVING, AND WHAT YOU MUST STAY OUT OF."},
  {num:5,title:"Load-In Fundamentals",lessons:[
    {id:"5.1",name:"The Sequence",obj:"Understand truck-to-room workflow."},
    {id:"5.2",name:"Control & Visibility",obj:"Move with awareness and spotters."},
    {id:"5.3",name:"Pinch Points & Coordination",obj:"Handle gear safely with a team."},
    {id:"5.4",name:"Load-In Integration",obj:"Apply concepts through full sequence."}
  ],rule:"MOVE WHAT YOU ARE ASSIGNED, IN THE ORDER YOU ARE GIVEN, WITH A CLEAR PATH AND CONTROL OF THE LOAD."},
  {num:6,title:"Communication & Crew Etiquette",lessons:[
    {id:"6.1",name:"Clarity First",obj:"Communicate clearly and briefly."},
    {id:"6.2",name:"Confirm & Report",obj:"Confirm what you heard and check in."},
    {id:"6.3",name:"Professional Presence",obj:"Respond to correction and respect teams."}
  ],rule:"BE CLEAR, BRIEF, AND HONEST: CONFIRM WHAT YOU HEARD, ASK WHEN YOU DO NOT UNDERSTAND, AND CHECK BACK IN WHEN THE TASK IS DONE."},
  {num:7,title:"Department Basics",lessons:[
    {id:"7.1",name:"Physical Support vs. Technical",obj:"Know the boundary you cannot cross."},
    {id:"7.2",name:"Permission Levels",obj:"Classify objects by what you can do."},
    {id:"7.3",name:"Classification Practice",obj:"Apply permission levels to new scenes."}
  ],rule:"SUPPORT THE PHYSICAL WORKFLOW. PRESERVE THE TECHNICAL OR SHOW-CRITICAL SETUP."},
  {num:8,title:"Tools, Gear & Handling",lessons:[
    {id:"8.1",name:"Recognize It",obj:"Distinguish recognition from authorization."},
    {id:"8.2",name:"Check It",obj:"Inspect before using or moving."},
    {id:"8.3",name:"Use It Safely",obj:"Coordinate team handling and methods."}
  ],rule:"RECOGNIZE IT, CHECK IT, THEN USE OR MOVE IT ONLY THE WAY YOU WERE ASSIGNED."},
  {num:9,title:"Load-Out Fundamentals",lessons:[
    {id:"9.1",name:"Strike Discipline",obj:"Wait for clearance despite urgency."},
    {id:"9.2",name:"Fatigue & Urgency",obj:"Maintain discipline under pressure."},
    {id:"9.3",name:"Finish Strong",obj:"Complete the job with care."}
  ],rule:"FINISH WITH THE SAME DISCIPLINE YOU STARTED WITH: WAIT FOR CLEARANCE, CONTROL THE LOAD, COMMUNICATE, AND STAY USEFUL UNTIL RELEASED."},
  {num:10,title:"Getting Hired, Called Back & Growing",lessons:[
    {id:"10.1",name:"Getting Hired",obj:"Communicate honestly about skills."},
    {id:"10.2",name:"Reputation Patterns",obj:"Understand what drives callbacks."},
    {id:"10.3",name:"Into Specialization",obj:"Find your pathway into departments."},
    {id:"10.4",name:"First Month & Beyond",obj:"Prioritize fundamentals and growth."}
  ],rule:"GETTING HIRED OPENS THE DOOR. RELIABILITY KEEPS IT OPEN. HONEST LEARNING IS HOW YOU MOVE FORWARD."}
];

let current = 0;
let total = modules.reduce((sum,m)=>sum+m.lessons.length,0);

function buildSidebar(){
  const s = document.getElementById('sidebar');
  let h='<div class="small" style="padding:5px 8px 10px;text-transform:uppercase;letter-spacing:.12em">Stagehand Fundamentals</div>';
  modules.forEach((m,mi)=>{
    const isActive = current>=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0) && current<modules.slice(0,mi+1).reduce((s,x)=>s+x.lessons.length,0);
    h+=`<div class="mod ${isActive?'active':''}" onclick="goModule(${mi})"><span class="num">${m.num}</span><div><b>${m.title}</b><div class="small">${m.lessons.length} lessons</div></div></div>`;
    h+=`<div class="sub">`;
    m.lessons.forEach((l,li)=>{
      const idx = modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0)+li;
      h+=`<button class="nav ${idx===current?'active':''}" onclick="goLesson(${idx})">${l.id} ${l.name}</button>`;
    });
    h+=`</div>`;
  });
  s.innerHTML=h;
  buildMobileSelect();
}

function buildMobileSelect(){
  const m=document.getElementById('mobile');
  m.innerHTML='';
  let idx=0;
  modules.forEach(mod=>{
    mod.lessons.forEach(l=>{
      const opt=document.createElement('option');
      opt.value=idx;
      opt.textContent=`${l.id} ${l.name}`;
      if(idx===current)opt.selected=true;
      m.appendChild(opt);
      idx++;
    });
  });
  m.onchange=e=>goLesson(+e.target.value);
}

function getModuleLesson(idx){
  let count=0;
  for(let m of modules){
    if(count+m.lessons.length>idx)return [m,m.lessons[idx-count]];
    count+=m.lessons.length;
  }
  return [modules[0],modules[0].lessons[0]];
}

function goLesson(idx){
  current=Math.max(0,Math.min(idx,total-1));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goModule(mi){
  const idx=modules.slice(0,mi).reduce((s,x)=>s+x.lessons.length,0);
  goLesson(idx);
}

    <defs><style>

      .phase-title{font-size:14px;font-weight:bold;fill:#f5b400}

    </style></defs>

  return `<svg viewBox="0 0 500 240" style="width:100%;max-width:600px">
    <defs><style>
      .box{fill:#0f1419;stroke:#0284c7;stroke-width:2;rx:6}

function render(){
  const [mod,lesson]=getModuleLesson(current);
  document.getElementById('progtext').textContent=`${lesson.id} of ${total} lessons`;
  document.getElementById('pct').textContent=Math.round((current+1)/total*100)+'%';
  document.getElementById('bar').style.width=(current+1)/total*100+'%';

  let html=`<section class="hero">
    <div class="eyebrow">Module ${mod.num} • Lesson ${lesson.id}</div>
    <h1>${lesson.name}</h1>
    <p><b>Objective:</b> ${lesson.obj}</p>
    <div class="rule">${mod.rule}</div>
  </section>`;

  if(lesson.id==='1.1')html+=renderM11();
  else if(lesson.id==='1.2')html+=renderM12();
  else if(lesson.id==='1.3')html+=renderM13();
  else if(lesson.id==='1.4')html+=renderM14();
  else if(lesson.id==='2.1')html+=renderM21();
  else if(lesson.id==='2.2')html+=renderM22();
  else if(lesson.id==='2.3')html+=renderM23();
  else if(lesson.id==='2.4')html+=renderM24();
  else if(lesson.id==='3.1')html+=renderM31();
  else if(lesson.id==='3.2')html+=renderM32();
  else if(lesson.id==='3.3')html+=renderM33();
  else if(lesson.id==='4.1')html+=renderM41();
  else if(lesson.id==='4.2')html+=renderM42();
  else if(lesson.id==='4.3')html+=renderM43();
  else if(lesson.id==='5.1')html+=renderM51();
  else if(lesson.id==='5.2')html+=renderM52();
  else if(lesson.id==='5.3')html+=renderM53();
  else if(lesson.id==='5.4')html+=renderM54();
  else if(lesson.id==='6.1')html+=renderM61();
  else if(lesson.id==='6.2')html+=renderM62();
  else if(lesson.id==='6.3')html+=renderM63();
  else if(lesson.id==='7.1')html+=renderM71();
  else if(lesson.id==='7.2')html+=renderM72();
  else if(lesson.id==='7.3')html+=renderM73();
  else if(lesson.id==='8.1')html+=renderM81();
  else if(lesson.id==='8.2')html+=renderM82();
  else if(lesson.id==='8.3')html+=renderM83();

  </div>`;

  document.getElementById('main').innerHTML=html;
  buildSidebar();
}

function renderM11(){
  return `<div class="card objective">
    <h3>What Do Stagehands Actually Do?</h3>
    <div class="explainer">Stagehands provide <strong>safe, organized labor</strong> that production depends on. On a call you might unload trucks, push road cases, set staging, move barricade, run cable under direction, sort gear by department, or help reset a venue. The constant: following direction safely while protecting gear and keeping the production moving. This is not "moving boxes"—it's being the reliable hands that every other department counts on to get their equipment from truck to stage and back.</div>

        <li><strong>Hazard:</strong> Wet floor, forklift, suspended load, unplugged cable, sharp edge, combustible material. The thing that can cause harm.</li>
        <li><strong>Risk:</strong> The likelihood and severity given current conditions. Wet floor in an empty hallway at 9 AM (low risk) vs. wet floor in a busy case route at 4 PM (high risk). Risk is hazard + exposure.</li>
        <li><strong>Unsafe behavior:</strong> Walking through the wet floor (unsafe). Going around or over it (safe). Same hazard, different behavior.</li>

  <div class="card">

}

function renderM22(){

    <div class="explainer">This is your decision flowchart for every hazard you notice. <strong>Notice</strong> something that could cause harm, <strong>classify</strong> whether you can control it safely, <strong>control</strong> it if you can, <strong>escalate</strong> if you cannot. This model repeats throughout your stagehand career. It gives you a clear path: you are not guessing whether to report something or trying to fix problems beyond your authority.</div>
    <div class="reference">

function renderM42(){

function renderM61(){

      [...g.children].forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('correct')});
      if(b.dataset.c!=='1')b.classList.add('incorrect');
      const cid=g.dataset.q+'c';
      const coach=document.getElementById(cid);
      if(coach)coach.classList.add('show');
    });
  });
