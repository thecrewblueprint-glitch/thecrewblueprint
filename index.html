<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>The Crew Blueprint — Rebuild in Progress</title>
  <meta name="description" content="The Crew Blueprint is being reorganized into an integrated training and career-navigation system.">
  <style>
    :root{color-scheme:dark;--bg:#080b10;--panel:#111722;--text:#eef2f6;--muted:#aeb8c7;--gold:#f5b400;--line:#2a3444}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{max-width:720px;width:100%;padding:36px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
    .mark{font-weight:800;letter-spacing:.04em}.mark span{color:var(--gold)}h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:24px 0 18px}p{color:var(--muted);font-size:18px;margin:0}.rule{height:3px;width:72px;background:var(--gold);margin-top:28px}
  </style>
</head>
<body>
  <main>
    <div class="mark">THE CREW <span>BLUEPRINT</span></div>
    <h1>Rebuild in progress.</h1>
    <p>The prior site versions have been archived intact. The next release is being planned as an integrated training, career-navigation, and work-intelligence system.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
