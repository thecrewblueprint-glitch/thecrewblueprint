name: Deploy Crew Blueprint to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crew-blueprint-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate successor public projection
        run: node scripts/generate-successor-projections.mjs

      - name: Validate successor public projection
        run: node scripts/validate-successor-projections.mjs

      - name: Check successor client syntax
        run: node --check js/successor-client.js

      - name: Validate successor client
        run: node scripts/validate-successor-client.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='research' \
            --exclude='content/archive' \
            --exclude='ai-communication' \
            --exclude='handoffs' \
            --exclude='docs' \
            --exclude='archive' \
            --exclude='*.md' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
