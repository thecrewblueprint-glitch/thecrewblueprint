name: Export Interactive Site Versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '_includes/v2-baseline.html'
      - 'css/**'
      - 'js/**'
      - 'lab/clean-sheet-v1/**'
      - 'research/analysis/clean-sheet-v1-ui-ux-usability-audit-2026-09-06.md'
      - '.github/workflows/export-interactive-versions.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained review folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export-package
          mkdir -p export-package/01-Regular-v2 export-package/02-Clean-sheet-v1 export-package/03-Audit

          python <<'PY'
          from pathlib import Path
          baseline = Path('_includes/v2-baseline.html').read_text(encoding='utf-8')
          baseline = baseline.replace('</head>', '<link rel="stylesheet" href="css/v2-client-layer.css?v=20260906"><link rel="stylesheet" href="css/v2-footer-three-column.css?v=20260906-footer3"></head>')
          baseline = baseline.replace('</body>', '<script src="js/v2-client-layer.js?v=20260906"></script><script src="js/v2-footer-three-column.js?v=20260906-footer3"></script></body>')
          Path('export-package/01-Regular-v2/index.html').write_text(baseline, encoding='utf-8')
          PY

          for dir in css js assets images fonts courses; do
            if [ -d "$dir" ]; then cp -a "$dir" "export-package/01-Regular-v2/"; fi
          done

          for file in about.html contact.html accessibility-statement.html affiliate-disclosure.html limitation-of-liability.html privacy-policy.html terms-and-conditions.html robots.txt sitemap.xml manifest.json favicon.svg; do
            if [ -f "$file" ]; then cp "$file" "export-package/01-Regular-v2/"; fi
          done

          cp -a lab/clean-sheet-v1/. export-package/02-Clean-sheet-v1/
          cp research/analysis/clean-sheet-v1-ui-ux-usability-audit-2026-09-06.md export-package/03-Audit/
          cp research/analysis/clean-sheet-learning-product-2026-09-06.md export-package/03-Audit/ 2>/dev/null || true
          cp research/analysis/clean-sheet-learning-product-source-ledger-2026-09-06.json export-package/03-Audit/ 2>/dev/null || true

          cat > export-package/README.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Crew Blueprint — Interactive Version Archive</title>
          <style>body{margin:0;background:#0b0d0f;color:#f2efe9;font-family:system-ui,-apple-system,sans-serif;line-height:1.5}main{max-width:900px;margin:auto;padding:64px 24px}h1{font-size:42px;margin-bottom:8px}p{color:#a9afb4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:32px}.card{display:block;padding:24px;border:1px solid #2a3036;border-radius:12px;background:#111417;color:#f2efe9;text-decoration:none}.card:hover{border-color:#e3a62f}.card strong{display:block;font-size:22px;margin-bottom:8px}.card span{color:#a9afb4}.note{margin-top:30px;padding:18px;border-left:3px solid #e3a62f;background:#171b1f;color:#a9afb4}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main>
          <div style="color:#f2be4b;font-size:11px;letter-spacing:.12em;text-transform:uppercase">The Crew Blueprint · preserved interactive versions</div>
          <h1>Choose the version you want to review.</h1>
          <p>These folders are independent review artifacts. Opening one does not modify or replace the other.</p>
          <div class="grid">
            <a class="card" href="01-Regular-v2/index.html"><strong>Regular v2</strong><span>The restored v2 learner site with the accepted client/footer refinements and without the vNext Owner Review overlay.</span></a>
            <a class="card" href="02-Clean-sheet-v1/index.html"><strong>Clean-Sheet v1</strong><span>The separate noindex experiment built around learner journey, industry context, hiring needs, and career navigation.</span></a>
          </div>
          <div class="note"><strong>UI/UX audit:</strong> see the <code>03-Audit</code> folder. For best results, unzip the package before opening these HTML files.</div>
          </main></body></html>
          HTML

          cat > export-package/01-Regular-v2/README.txt <<'TXT'
          REGULAR V2 — preserved interactive artifact
          Open index.html in a browser.
          This copy excludes the clean-sheet lab and vNext Owner Review overlay.
          TXT

          cat > export-package/02-Clean-sheet-v1/README.txt <<'TXT'
          CLEAN-SHEET V1 — preserved interactive experimental artifact
          Open index.html in a browser.
          This remains independent from the regular v2 site.
          TXT

          find export-package -type f -print | sort > export-package/FILE_MANIFEST.txt

      - name: Smoke-test exported entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s export-package/01-Regular-v2/index.html
          test -s export-package/02-Clean-sheet-v1/index.html
          test -s export-package/02-Clean-sheet-v1/content.js
          test -s export-package/02-Clean-sheet-v1/context-labs.js
          test -s export-package/02-Clean-sheet-v1/app.js
          node --check export-package/02-Clean-sheet-v1/content.js
          node --check export-package/02-Clean-sheet-v1/context-labs.js
          node --check export-package/02-Clean-sheet-v1/app.js
          grep -q 'v2-client-layer.css' export-package/01-Regular-v2/index.html
          ! grep -q 'vnext-owner-review' export-package/01-Regular-v2/index.html
          grep -q 'noindex,nofollow' export-package/02-Clean-sheet-v1/index.html

      - name: Upload interactive version package
        uses: actions/upload-artifact@v4
        with:
          name: crew-blueprint-interactive-version-archive
          path: export-package
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
