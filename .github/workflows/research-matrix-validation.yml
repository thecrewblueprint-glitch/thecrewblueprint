name: Research Matrix Validation

on:
  pull_request:
    paths:
      - 'research/**'
      - 'scripts/validate-research-matrix.mjs'
      - 'scripts/generate-research-matrix-views.mjs'
      - 'scripts/generate-owner-competency-state-view.mjs'
      - 'scripts/generate-responsibility-access-classification.mjs'
      - 'scripts/apply-responsibility-access-reviewed-overrides.mjs'
      - 'scripts/validate-responsibility-access-classification.mjs'
      - '.github/workflows/research-matrix-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'research/**'
      - 'scripts/validate-research-matrix.mjs'
      - 'scripts/generate-research-matrix-views.mjs'
      - 'scripts/generate-owner-competency-state-view.mjs'
      - 'scripts/generate-responsibility-access-classification.mjs'
      - 'scripts/apply-responsibility-access-reviewed-overrides.mjs'
      - 'scripts/validate-responsibility-access-classification.mjs'
      - '.github/workflows/research-matrix-validation.yml'

permissions:
  contents: read

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate matrix data
        run: node scripts/validate-research-matrix.mjs

      - name: Generate audit views
        run: |
          node scripts/generate-research-matrix-views.mjs
          node scripts/generate-owner-competency-state-view.mjs

      - name: Verify generated owner view
        run: test -s research/matrix/views/owner-competency-state.md

      - name: Generate responsibility/access classification
        run: node scripts/generate-responsibility-access-classification.mjs

      - name: Apply reviewed responsibility/access adjudications
        run: node scripts/apply-responsibility-access-reviewed-overrides.mjs

      - name: Validate responsibility/access classification
        run: node scripts/validate-responsibility-access-classification.mjs

      - name: Upload responsibility/access diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsibility-access-diagnostics
          path: |
            research/generated/responsibility-access-classification-143.jsonl
            research/generated/responsibility-access-ambiguities.jsonl
            research/generated/responsibility-access-summary.json
            research/generated/responsibility-access-validation-report.json
          if-no-files-found: error
          retention-days: 7
