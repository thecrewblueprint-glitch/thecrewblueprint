name: Standalone Production Validation

on:
  pull_request:
    paths:
      - 'deployment/standalone/**'
      - 'scripts/build-standalone-production-package.mjs'
      - 'scripts/build-wordpress-production-package.mjs'
      - 'config/wordpress-production-contract.json'
      - 'data/generated/free-web-client-projection.json'
      - '.github/workflows/standalone-production-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate free public client projection
        run: node scripts/generate-free-web-client-projection.mjs

      - name: Generate free course runtime
        run: node scripts/generate-free-course-runtime.mjs

      - name: Build free-tier release artifact
        run: node scripts/build-free-release-artifact.mjs

      - name: Build WordPress generated-content projection
        run: node scripts/build-wordpress-production-package.mjs

      - name: Build standalone IONOS/PHP package
        run: node scripts/build-standalone-production-package.mjs

      - name: Check standalone PHP syntax
        run: |
          php -l _standalone/the-crew-blueprint/index.php
          find _standalone/the-crew-blueprint/content -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Confirm production secret is not packaged
        run: |
          test ! -f _standalone/the-crew-blueprint/config/local.php
          ! grep -R --line-number --binary-files=without-match 'sk_live_' _standalone/the-crew-blueprint

      - name: Confirm protected/config directories are denied by Apache rules
        run: |
          grep -F 'RewriteRule ^config' _standalone/the-crew-blueprint/.htaccess
          grep -F 'RewriteRule ^content' _standalone/the-crew-blueprint/.htaccess
          grep -F 'Require all denied' _standalone/the-crew-blueprint/config/.htaccess

      - name: Upload standalone production package
        uses: actions/upload-artifact@v4
        with:
          name: crew-blueprint-standalone-production
          path: |
            _standalone/the-crew-blueprint-standalone-production.zip
            _standalone/the-crew-blueprint-standalone-production.manifest.json
          if-no-files-found: error
          retention-days: 7
