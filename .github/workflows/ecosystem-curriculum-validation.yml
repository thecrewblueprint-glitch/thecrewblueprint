name: Ecosystem Curriculum Validation
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[matrix-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate ecosystem matrix
        run: node scripts/generate-ecosystem-matrix.mjs
      - name: Generate successor projections
        run: node scripts/generate-successor-projections.mjs
      - name: Validate successor projections
        run: node scripts/validate-successor-projections.mjs
      - name: Check successor client syntax
        run: node --check js/successor-client.js
      - name: Validate successor client
        run: node scripts/validate-successor-client.mjs
      - name: Audit free release readiness
        run: node scripts/audit-free-release-readiness.mjs
      - name: Validate free assessment policy
        run: node scripts/validate-free-assessment-policy.mjs
      - name: Validate normalized research matrix
        run: node scripts/validate-research-matrix.mjs
      - name: Validate ecosystem curriculum
        run: node scripts/validate-ecosystem-curriculum.mjs
      - name: Validate course consent coverage
        run: node scripts/validate-course-consent.mjs
      - name: Validate accessibility structural baseline
        run: node scripts/validate-accessibility-baseline.mjs
      - name: Generate matrix views
        run: |
          node scripts/generate-research-matrix-views.mjs
          node scripts/generate-owner-competency-state-view.mjs
